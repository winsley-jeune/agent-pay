name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:mcp
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://agentpay:agentpay@localhost:5433/agentpay_test
