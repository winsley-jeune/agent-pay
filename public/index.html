<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPay</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #2f5bea; --accent-text: #fff; --ok: #137a3f; --warn: #a15c00; --bad: #b42318; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e8eaef; --muted: #98a1b0; --line: #2a2f3a;
      --accent: #6d8dff; --accent-text: #0f1115; --ok: #4cc38a; --warn: #f0a94b; --bad: #ff7a6e; --chip: #222733; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .balance { margin-left: auto; font-variant-numeric: tabular-nums; }
  nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
  nav a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  nav a.active { background: var(--chip); color: var(--text); font-weight: 600; }
  nav a .count { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  section { display: none; } section.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .big { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--ok); } .neg { color: var(--text); }
  .chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .table-wrap { overflow-x: auto; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; display: none; max-width: calc(100% - 32px); z-index: 5; }
  .login { max-width: 420px; margin: 60px auto; }
  .suggestion { border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="/vendor/simplewebauthn-browser.js"></script>
<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (c) => (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
const toCents = (v) => (v === "" || v == null ? null : Math.round(Number(v) * 100));
const fromCents = (c) => (c == null ? "" : (c / 100).toFixed(2));
const date = (d) => (d ? new Date(d).toLocaleString() : "");

let token = null;
try { token = localStorage.getItem("agentpay.token"); } catch {}
let me = null;
let tab = location.hash.slice(1) || "all";

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4000);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { ...(token ? { authorization: "Bearer " + token } : {}), ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error?.message || "HTTP " + res.status);
  return json;
}
const act = (fn) => async (e) => { const b = e?.currentTarget; if (b) b.disabled = true; try { await fn(e); } catch (err) { toast(err.message); } finally { if (b) b.disabled = false; } };

// ------------------------------------------------------------------ login
function renderLogin() {
  $("#app").innerHTML = `
    <div class="login card">
      <h3>AgentPay</h3>
      <p class="muted small">A prepaid wallet for your AI agents. You set the limits; they pay for tools and subscriptions; you approve big spending with your passkey.</p>
      <label>Owner token<input id="tok" placeholder="ap_owner_..." autocomplete="off"></label>
      <div class="row" style="margin-top:8px"><button class="primary" id="signin">Sign in</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <label>New account email<input id="email" type="email" placeholder="you@example.com"></label>
      <div class="row" style="margin-top:8px"><button id="signup">Create account</button></div>
      <div id="newtok"></div>
    </div>`;
  $("#signin").onclick = act(async () => { token = $("#tok").value.trim(); await boot(); });
  $("#signup").onclick = act(async () => {
    const r = await api("POST", "/api/signup", { email: $("#email").value.trim() });
    $("#newtok").innerHTML = `<p class="small">Your owner token (shown once; store it in a password manager):</p><pre>${esc(r.token)}</pre>`;
    $("#tok").value = r.token;
  });
}

// ------------------------------------------------------------------ shell
const tabs = [["all", "All subscriptions"], ["wallet", "Wallet"], ["approvals", "Approvals"], ["subscriptions", "Agent plans"], ["agents", "Agent keys"], ["security", "Passkeys"], ["provider", "Sell tools"]];

async function boot() {
  if (!token) return renderLogin();
  try { me = await api("GET", "/api/me"); } catch { token = null; try { localStorage.removeItem("agentpay.token"); } catch {} return renderLogin(); }
  try { localStorage.setItem("agentpay.token", token); } catch {}
  $("#app").innerHTML = `
    <header><h1>AgentPay</h1><span class="muted small">${esc(me.user.email)}</span>
      <span class="balance" id="bal"></span><button id="logout">Sign out</button></header>
    <nav>${tabs.map(([k, v]) => `<a href="#${k}" data-tab="${k}">${v}<span id="count-${k}"></span></a>`).join("")}</nav>
    <main>${tabs.map(([k]) => `<section id="tab-${k}"></section>`).join("")}</main>`;
  $("#logout").onclick = () => { try { localStorage.removeItem("agentpay.token"); } catch {} token = null; renderLogin(); };
  const params = new URLSearchParams(location.search);
  if (params.get("topup") === "success") toast("Payment received. Credits appear as soon as Stripe confirms it.");
  if (params.get("topup") === "cancelled") toast("Top-up cancelled.");
  show(tab);
  refreshCounts();
  setInterval(refreshCounts, 15000);
}

window.addEventListener("hashchange", () => token && me && show(location.hash.slice(1) || "all"));

async function refreshCounts() {
  try {
    me = await api("GET", "/api/me");
    $("#bal").innerHTML = `<span class="muted small">Balance</span> <b>${usd(me.balanceCents)}</b>`;
    const { approvals } = await api("GET", "/api/approvals?status=pending");
    $("#count-approvals").innerHTML = approvals.length ? `<span class="count">${approvals.length}</span>` : "";
  } catch {}
}

function show(name) {
  tab = tabs.some(([k]) => k === name) ? name : "all";
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("active", s.id === "tab-" + tab));
  ({ all, wallet, approvals, subscriptions, agents, security, provider })[tab]().catch((e) => toast(e.message));
}

// ------------------------------------------------------------------ all subscriptions
let catalog = null;
const billedLabel = { direct: "Card", apple: "Apple", google: "Google Play", amazon: "Amazon", carrier: "Phone bill", other: "Other", agentpay: "AgentPay wallet" };
const statusLabel = { active: ["active", "ok"], trial: ["free trial", "warn"], cancel_requested: ["cancel requested", "warn"], cancel_approved: ["cancel approved", "warn"],
  canceling: ["cancels at period end", "warn"], past_due: ["past due", "bad"], pending_approval: ["waiting for approval", "warn"], canceled: ["cancelled", "bad"] };

async function all() {
  const el = $("#tab-all");
  catalog ??= await api("GET", "/api/everyday/catalog");
  const [data, { suggestions }] = await Promise.all([api("GET", "/api/everyday"), api("GET", "/api/everyday/suggestions")]);
  const cats = Object.entries(data.totals.byCategory).sort((a, b) => b[1] - a[1]);
  el.innerHTML = `
    <div class="card spread">
      <div><div class="muted small">All subscriptions, per month</div><div class="big">${usd(data.totals.monthlyCents)}</div>
        <div class="small muted">${usd(data.totals.yearlyCents)} a year · ${data.items.filter((i) => i.status !== "trial").length} paid · ${data.items.filter((i) => i.status === "trial").length} in free trial</div></div>
      <div class="row" style="max-width:520px">${cats.map(([c, v]) => `<span class="chip">${esc(c)} ${usd(v)}</span>`).join("")}</div>
    </div>
    ${data.reminders.length ? `<div class="card"><h3>Coming up</h3>${data.reminders.map((r) => `<div class="suggestion" style="border-color:var(--warn)">${esc(r.message)}</div>`).join("")}</div>` : ""}
    ${suggestions.length ? `<div class="card"><h3>Ways to save</h3>${suggestions.map((s) => `<div class="suggestion">${esc(s.message)}
      ${s.monthlySavingsCents ? `<span class="chip ok">save ${s.approximate ? "about " : ""}${usd(s.monthlySavingsCents)}/mo</span>` : ""}</div>`).join("")}
      <p class="small muted">Catalog prices are approximate (as of ${esc(catalog.pricesAsOf)}); check the provider's site before switching.</p></div>` : ""}
    <div class="card"><h3>Everything you pay for</h3><div class="table-wrap"><table>
      <tr><th>Subscription</th><th>Paid through</th><th class="num">Price</th><th>Next charge</th><th>Status</th><th></th></tr>
      ${data.items.map((i) => {
        const [label, cls] = statusLabel[i.status] ?? [i.status, ""];
        return `<tr>
        <td><b>${esc(i.name)}</b>${i.contract ? ` <span class="chip warn" title="Cancelling may cost money or need notice">contract</span>` : ""}<div class="small muted">${esc(i.category)}${i.provider ? " · " + esc(i.provider) : ""}</div></td>
        <td class="small">${esc(billedLabel[i.billedThrough] ?? i.billedThrough)}${i.paymentMethod && i.kind === "external" ? `<div class="muted">${esc(i.paymentMethod)}</div>` : ""}</td>
        <td class="num">${usd(i.priceCents)}/${i.interval}${i.interval !== "month" ? `<div class="small muted">≈ ${usd(i.monthlyCents)}/mo</div>` : ""}</td>
        <td class="small">${esc(i.nextRenewalOn ?? "")}</td>
        <td><span class="chip ${cls}">${esc(label)}</span></td>
        <td class="row">${i.kind === "agentpay" ? `<a href="#subscriptions" class="small">manage</a>` : `
          <button data-guide="${i.id}">How to cancel</button>
          ${i.status !== "canceled" ? `<button data-done="${i.id}">Mark cancelled</button>` : ""}
          <button data-edit="${i.id}">Edit</button>`}</td></tr>
        <tr id="detail-${i.id}" style="display:none"><td colspan="6"></td></tr>`;
      }).join("") || `<tr><td colspan="6" class="muted">Nothing tracked yet. Add your subscriptions below or import a bank statement.</td></tr>`}
    </table></div></div>
    <div class="card"><h3>Add a subscription</h3>
      <div class="grid" id="addext">
        <label>Service<select name="service"><option value="">Other (type a name)</option>${catalog.services.map((s) => `<option value="${esc(s.slug)}">${esc(s.name)}</option>`).join("")}</select></label>
        <label>Name (if other)<input name="name"></label>
        <label>Price you pay ($)<input name="price" type="number" step="0.01" min="0"></label>
        <label>Every<select name="interval"><option>month</option><option>year</option><option>week</option></select></label>
        <label>Paid through<select name="billed">${Object.entries(billedLabel).filter(([k]) => k !== "agentpay").map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
        <label>Next charge<input name="next" type="date"></label>
        <label>Free trial ends<input name="trial" type="date"></label>
        <label>Contract until<input name="contract" type="date"></label>
        <label>Early termination fee ($)<input name="etf" type="number" step="0.01" min="0"></label>
        <label>Card / account<input name="pm" placeholder="Visa ending 4242"></label>
      </div>
      <p class="small muted">Subscribed on an iPhone, Android phone or Amazon? Choose Apple, Google Play or Amazon under "Paid through": that's where you cancel it.</p>
      <div class="row"><button class="primary" id="addextbtn">Add</button></div>
    </div>
    <div class="card"><h3>Find subscriptions in a bank statement</h3>
      <p class="small muted">Download a CSV of the last few months from your bank or card website and pick it here. It stays on this AgentPay server and is only used to find recurring charges.</p>
      <div class="row"><input type="file" id="csv" accept=".csv,text/csv"><button id="importbtn">Import</button></div>
      <div id="importres"></div>
    </div>`;

  $("#addext [name=service]").onchange = (e) => {
    const s = catalog.services.find((x) => x.slug === e.target.value);
    const tier = s?.tiers?.find((t) => !t.ads) ?? s?.tiers?.[0];
    if (tier && !$("#addext [name=price]").value) $("#addext [name=price]").value = (tier.priceCents / 100).toFixed(2);
    if (s?.category === "phone") $("#addext [name=billed]").value = "carrier";
  };
  $("#addextbtn").onclick = act(async () => {
    const f = (n) => $(`#addext [name=${n}]`).value.trim();
    const trial = f("trial");
    await api("POST", "/api/everyday", {
      serviceSlug: f("service") || undefined, name: f("name") || undefined, priceCents: toCents(f("price")) ?? 0, interval: f("interval"),
      billedThrough: f("billed"), nextRenewalOn: f("next") || undefined, trialEndsOn: trial || undefined, status: trial ? "trial" : "active",
      contractUntil: f("contract") || undefined, earlyTerminationFeeCents: toCents(f("etf")) ?? undefined, paymentMethod: f("pm") || undefined,
    });
    toast("Added."); all();
  });
  $("#importbtn").onclick = act(async () => {
    const file = $("#csv").files[0];
    if (!file) return toast("Choose a CSV file first.");
    const r = await api("POST", "/api/everyday/import", { csv: await file.text() });
    $("#importres").innerHTML = `
      <p class="small">${r.imported} new transactions read${r.skippedDuplicates ? `, ${r.skippedDuplicates} already imported` : ""}.</p>
      ${r.alerts.map((a) => `<div class="suggestion" style="border-color:var(--bad)">${esc(a.message)}</div>`).join("")}
      ${r.proposals.length ? `<p><b>Looks like subscriptions you're not tracking yet:</b></p><table>${r.proposals.map((p, n) => `<tr>
        <td><b>${esc(p.name)}</b><div class="small muted">${p.charges} charge${p.charges > 1 ? "s" : ""}, last ${esc(p.lastChargedOn)} · ${p.confidence} confidence${p.note ? "<br>" + esc(p.note) : ""}</div></td>
        <td class="num">${usd(p.priceCents)}/${p.interval}</td><td><button data-propose="${n}">Add</button></td></tr>`).join("")}</table>` : `<p class="small muted">No new recurring charges found.</p>`}`;
    $("#importres").querySelectorAll("[data-propose]").forEach((b) => (b.onclick = act(async () => {
      const p = r.proposals[Number(b.dataset.propose)];
      await api("POST", "/api/everyday", { serviceSlug: p.serviceSlug ?? undefined, name: p.serviceSlug ? undefined : p.name, category: p.category,
        priceCents: p.priceCents, interval: p.interval, billedThrough: p.billedThrough, nextRenewalOn: p.nextRenewalOn });
      b.replaceWith(Object.assign(document.createElement("span"), { className: "chip ok", textContent: "added" }));
    })));
  });

  const detail = (id, html) => { const row = $("#detail-" + id); row.style.display = row.style.display === "none" || html ? "" : "none"; row.firstElementChild.innerHTML = html; };
  el.querySelectorAll("[data-guide]").forEach((b) => (b.onclick = act(async () => {
    const g = await api("GET", `/api/everyday/${b.dataset.guide}/cancel-guide`);
    detail(b.dataset.guide, `<div class="small"><b>Cancel in: ${esc(g.where)}</b>${g.url ? ` · <a href="${esc(g.url)}" target="_blank" rel="noopener">open</a>` : ""}
      <ol>${g.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      ${g.warnings.map((w) => `<div style="color:var(--warn)">⚠ ${esc(w)}</div>`).join("")}</div>`);
  })));
  el.querySelectorAll("[data-done]").forEach((b) => (b.onclick = act(async () => {
    detail(b.dataset.done, `<div class="row"><input id="conf-${b.dataset.done}" placeholder="Confirmation number (optional)"><button class="primary" id="confbtn-${b.dataset.done}">Mark cancelled</button></div>`);
    $("#confbtn-" + b.dataset.done).onclick = act(async () => {
      await api("POST", `/api/everyday/${b.dataset.done}/mark-canceled`, { confirmation: $("#conf-" + b.dataset.done).value || undefined });
      toast("Marked cancelled. If a charge still shows up, importing your statement will flag it."); all();
    });
  })));
  el.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = act(async () => {
    const { subscription: s } = await api("GET", `/api/everyday/${b.dataset.edit}`);
    const id = s.id;
    detail(id, `<div class="grid" id="edit-${id}">
      <label>Price ($)<input name="price" type="number" step="0.01" value="${fromCents(s.priceCents)}"></label>
      <label>Next charge<input name="next" type="date" value="${esc(s.nextRenewalOn ?? "")}"></label>
      <label>Last used<input name="used" type="date" value="${esc(s.lastUsedOn ?? "")}"></label>
      <label>Contract until<input name="contract" type="date" value="${esc(s.contractUntil ?? "")}"></label>
      <label>Paid through<select name="billed">${Object.entries(billedLabel).filter(([k]) => k !== "agentpay").map(([k, v]) => `<option value="${k}" ${k === s.billedThrough ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      </div><div class="row" style="margin-top:8px"><button class="primary" id="save-${id}">Save</button><button class="danger" id="del-${id}">Stop tracking</button></div>`);
    const f = (n) => $(`#edit-${id} [name=${n}]`).value;
    $("#save-" + id).onclick = act(async () => {
      await api("PATCH", `/api/everyday/${id}`, { priceCents: toCents(f("price")) ?? 0, nextRenewalOn: f("next") || null, lastUsedOn: f("used") || null, contractUntil: f("contract") || null, billedThrough: f("billed") });
      toast("Saved."); all();
    });
    $("#del-" + id).onclick = act(async () => { await api("DELETE", `/api/everyday/${id}`); toast("Removed."); all(); });
  })));
}

// ------------------------------------------------------------------ wallet
async function wallet() {
  const el = $("#tab-wallet");
  const { entries } = await api("GET", "/api/ledger");
  el.innerHTML = `
    <div class="card spread">
      <div><div class="muted small">Available credits</div><div class="big">${usd(me.balanceCents)}</div></div>
      <div class="row">
        <select id="amt">${[500, 1000, 2500, 5000, 10000].map((c) => `<option value="${c}">${usd(c)}</option>`).join("")}</select>
        <button class="primary" id="topup" ${me.stripeEnabled ? "" : "disabled title='Set STRIPE_SECRET_KEY to enable'"}>Top up with card</button>
        ${me.devCreditEnabled ? `<button id="dev">Add free test credits</button>` : ""}
      </div>
    </div>
    <div class="card"><h3>History</h3><div class="table-wrap"><table>
      <tr><th>When</th><th>What</th><th class="num">Amount</th></tr>
      ${entries.map((e) => `<tr><td class="small muted">${date(e.createdAt)}</td><td>${esc(e.memo || e.type)}</td>
        <td class="num ${e.amountCents > 0 ? "pos" : "neg"}">${e.amountCents > 0 ? "+" : ""}${usd(e.amountCents)}</td></tr>`).join("") ||
        `<tr><td colspan="3" class="muted">No activity yet.</td></tr>`}
    </table></div></div>`;
  $("#topup").onclick = act(async () => { location.href = (await api("POST", "/api/topups", { amountCents: Number($("#amt").value) })).url; });
  if ($("#dev")) $("#dev").onclick = act(async () => { await api("POST", "/api/dev/credit", { amountCents: Number($("#amt").value) }); await refreshCounts(); wallet(); });
}

// ------------------------------------------------------------------ approvals
async function approveWithPasskey(id) {
  if (!me.hasPasskey && me.requirePasskey) { toast("Register a passkey first (Passkeys tab)."); location.hash = "security"; return false; }
  if (!me.hasPasskey) { await api("POST", `/api/approvals/${id}/approve`, {}); return true; }
  const { summary, options } = await api("POST", `/api/approvals/${id}/start`);
  toast("Confirm on your device: " + summary);
  const passkey = await startAuthentication({ optionsJSON: options });
  await api("POST", `/api/approvals/${id}/approve`, { passkey });
  return true;
}

async function approvals() {
  const el = $("#tab-approvals");
  const { approvals: list } = await api("GET", "/api/approvals");
  const pending = list.filter((a) => a.status === "pending");
  const done = list.filter((a) => a.status !== "pending").slice(0, 20);
  el.innerHTML = `
    <div class="card"><h3>Waiting for you</h3>
      ${pending.map((a) => `
        <div class="spread" style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div><b>${esc(a.summary)}</b>
            <div class="small muted">Requested by ${esc(a.agentKeyName || "you")} · ${date(a.createdAt)}</div>
            ${a.input?.reason ? `<div class="small">Reason: “${esc(a.input.reason)}”</div>` : ""}
            ${a.kind === "call" ? `<div class="small muted">Input: <code>${esc(JSON.stringify(a.input).slice(0, 200))}</code></div>` : ""}
          </div>
          <div class="row"><button class="primary" data-approve="${a.id}">Approve with passkey</button><button class="danger" data-deny="${a.id}">Deny</button></div>
        </div>`).join("") || `<p class="muted">Nothing to approve.</p>`}
    </div>
    <div class="card"><h3>Recent decisions</h3><div class="table-wrap"><table>
      ${done.map((a) => `<tr><td>${esc(a.summary)}</td><td><span class="chip ${a.status === "denied" ? "bad" : "ok"}">${a.status}</span></td><td class="small muted">${date(a.decidedAt)}</td></tr>`).join("") || `<tr><td class="muted">None yet.</td></tr>`}
    </table></div></div>`;
  el.querySelectorAll("[data-approve]").forEach((b) => (b.onclick = act(async () => { if (await approveWithPasskey(b.dataset.approve)) toast("Approved."); await refreshCounts(); approvals(); })));
  el.querySelectorAll("[data-deny]").forEach((b) => (b.onclick = act(async () => { await api("POST", `/api/approvals/${b.dataset.deny}/deny`); await refreshCounts(); approvals(); })));
}

// ------------------------------------------------------------------ subscriptions
const statusChip = (s) => {
  const label = s.status === "active" && s.cancelAtPeriodEnd ? "cancels " + new Date(s.currentPeriodEnd).toLocaleDateString() : s.status.replace("_", " ");
  const cls = s.status === "active" && !s.cancelAtPeriodEnd ? "ok" : s.status === "past_due" ? "bad" : "warn";
  return `<span class="chip ${cls}">${esc(label)}</span>`;
};

async function subscriptions() {
  const el = $("#tab-subscriptions");
  const [{ subscriptions: subs }, rec] = await Promise.all([api("GET", "/api/subscriptions?all=1"), api("GET", "/api/recommendations")]);
  const live = subs.filter((s) => ["active", "past_due", "pending_approval"].includes(s.status));
  const monthlyTotal = live.filter((s) => s.status === "active").reduce((t, s) => t + (s.interval === "week" ? Math.round(s.priceCents * 52 / 12) : s.interval === "year" ? Math.round(s.priceCents / 12) : s.priceCents), 0);
  el.innerHTML = `
    <div class="card spread"><div><div class="muted small">Active subscriptions</div><div class="big">${live.filter((s) => s.status === "active").length}</div></div>
      <div><div class="muted small">About per month</div><div class="big">${usd(monthlyTotal)}</div></div></div>
    ${rec.suggestions.length ? `<div class="card"><h3>Ways to save</h3>${rec.suggestions.map((s) => `<div class="suggestion">${esc(s.message)} <span class="chip ok">save ${usd(s.monthlySavingsCents)}/mo</span></div>`).join("")}</div>` : ""}
    <div class="card"><h3>Your subscriptions</h3><div class="table-wrap"><table>
      <tr><th>Plan</th><th>Status</th><th>Renews</th><th class="num">Price</th><th>Included calls</th><th></th></tr>
      ${subs.map((s) => `<tr>
        <td><b>${esc(s.planName)}</b><div class="small muted">${esc(s.provider)} · ${esc(s.category)} · by ${esc(s.agentKeyName || "you")}</div>${s.pastDueReason ? `<div class="small" style="color:var(--bad)">${esc(s.pastDueReason.replaceAll("_", " "))}</div>` : ""}</td>
        <td>${statusChip(s)}</td>
        <td class="small">${s.status === "active" && !s.cancelAtPeriodEnd ? new Date(s.currentPeriodEnd).toLocaleDateString() : ""}</td>
        <td class="num">${usd(s.priceCents)}/${s.interval}<div class="small muted">limit ${usd(s.maxPriceCents)}</div></td>
        <td class="small">${s.includedCalls ? `${s.callsUsedThisPeriod ?? 0} / ${s.includedCalls} on ${esc(s.toolSlug)}` : "—"}</td>
        <td class="row">
          ${s.status === "past_due" || (s.status === "active" && s.cancelAtPeriodEnd) ? `<button class="primary" data-renew="${s.id}">Renew</button>` : ""}
          ${s.status === "active" && !s.cancelAtPeriodEnd ? `<button data-cancel="${s.id}">Cancel</button>` : ""}
          ${["active", "past_due", "pending_approval"].includes(s.status) ? `<button class="danger" data-cancel-now="${s.id}">End now</button>` : ""}
        </td></tr>`).join("") || `<tr><td colspan="6" class="muted">No subscriptions yet. Your agents can request them, or pick one below.</td></tr>`}
    </table></div></div>
    <div class="card"><h3>Marketplace</h3><div class="table-wrap"><table>
      <tr><th>Plan</th><th>Category</th><th class="num">Price</th><th class="num">≈ per month</th><th></th></tr>
      ${rec.catalog.map((p) => `<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.provider)} · ${esc(p.features.join(" · "))}</div></td>
        <td><span class="chip">${esc(p.category)}</span></td><td class="num">${usd(p.priceCents)}/${p.interval}</td><td class="num">${usd(p.monthlyCents)}</td>
        <td>${p.alreadySubscribed ? `<span class="chip ok">subscribed</span>` : `<button data-subscribe="${esc(p.slug)}">Subscribe</button>`}</td></tr>`).join("")}
    </table></div></div>`;
  el.querySelectorAll("[data-cancel]").forEach((b) => (b.onclick = act(async () => { await api("POST", `/api/subscriptions/${b.dataset.cancel}/cancel`, {}); toast("Will cancel at the end of the paid period."); subscriptions(); })));
  el.querySelectorAll("[data-cancel-now]").forEach((b) => (b.onclick = act(async () => { await api("POST", `/api/subscriptions/${b.dataset.cancelNow}/cancel`, { immediately: true }); toast("Ended."); subscriptions(); })));
  el.querySelectorAll("[data-renew]").forEach((b) => (b.onclick = act(async () => {
    const r = await api("POST", `/api/subscriptions/${b.dataset.renew}/renew`);
    if (await approveWithPasskey(r.approvalId)) toast("Renewed.");
    await refreshCounts(); subscriptions();
  })));
  el.querySelectorAll("[data-subscribe]").forEach((b) => (b.onclick = act(async () => {
    const r = await api("POST", "/api/subscriptions", { plan: b.dataset.subscribe });
    if (await approveWithPasskey(r.approvalId)) toast("Subscribed.");
    await refreshCounts(); subscriptions();
  })));
}

// ------------------------------------------------------------------ agent keys
const limitFields = [["perCallMaxCents", "Max per call ($)"], ["dailyCapCents", "Max per 24h ($)"], ["monthlyCapCents", "Max per 30 days ($)"], ["approvalThresholdCents", "Ask me above ($)"]];

function readLimits(scope) {
  const out = {};
  for (const [k] of limitFields) out[k] = toCents($(`[name=${k}]`, scope).value);
  const tools = $("[name=allowedToolSlugs]", scope).value.trim();
  out.allowedToolSlugs = tools ? tools.split(/[\s,]+/).filter(Boolean) : null;
  return out;
}

async function agents() {
  const el = $("#tab-agents");
  const { agentKeys } = await api("GET", "/api/agent-keys");
  const limitInputs = (k = {}) => limitFields.map(([f, l]) => `<label>${l}<input name="${f}" type="number" min="0" step="0.01" value="${fromCents(k[f])}" placeholder="no limit"></label>`).join("") +
    `<label>Allowed tools<input name="allowedToolSlugs" value="${esc((k.allowedToolSlugs || []).join(", "))}" placeholder="all tools"></label>`;
  el.innerHTML = `
    <div class="card"><h3>New agent key</h3>
      <p class="small muted">Give each agent its own key so you can see, limit and revoke it separately.</p>
      <div class="grid" id="newkey"><label>Name<input name="name" value="Claude Code"></label>${limitInputs({ perCallMaxCents: 100, dailyCapCents: 500, approvalThresholdCents: 50 })}</div>
      <div class="row" style="margin-top:10px"><button class="primary" id="create">Create key</button></div><div id="created"></div>
    </div>
    ${agentKeys.map((k) => `<div class="card" data-key="${k.id}">
      <div class="spread"><div><h3>${esc(k.name)} ${k.revokedAt ? `<span class="chip bad">revoked</span>` : ""}</h3>
        <div class="small muted">${esc(k.keyPrefix)}… · created ${date(k.createdAt)}</div>
        <div class="small">Spent ${usd(k.spend.spentLast24hCents)} in 24h · ${usd(k.spend.spentLast30dCents)} in 30 days</div></div>
        ${k.revokedAt ? "" : `<button class="danger" data-revoke="${k.id}">Revoke</button>`}</div>
      ${k.revokedAt ? "" : `<div class="grid" style="margin-top:10px">${limitInputs(k)}</div><div class="row" style="margin-top:8px"><button data-save="${k.id}">Save limits</button></div>`}
    </div>`).join("")}`;
  $("#create").onclick = act(async () => {
    const scope = $("#newkey");
    const r = await api("POST", "/api/agent-keys", { name: $("[name=name]", scope).value, ...readLimits(scope) });
    const cfg = { mcpServers: { agentpay: { command: "npx", args: ["-y", "tsx", me.mcpScript], env: { AGENTPAY_URL: location.origin, AGENTPAY_AGENT_KEY: r.key } } } };
    $("#created").innerHTML = `<p class="small">Agent key (shown once):</p><pre>${esc(r.key)}</pre>
      <p class="small">Add it to Claude Code:</p><pre>claude mcp add agentpay --scope user -e AGENTPAY_URL=${esc(location.origin)} -e AGENTPAY_AGENT_KEY=${esc(r.key)} -- npx -y tsx ${esc(me.mcpScript)}</pre>
      <p class="small">Or Claude Desktop (claude_desktop_config.json):</p><pre>${esc(JSON.stringify(cfg, null, 2))}</pre>`;
  });
  el.querySelectorAll("[data-save]").forEach((b) => (b.onclick = act(async () => { await api("PATCH", `/api/agent-keys/${b.dataset.save}`, readLimits(b.closest(".card"))); toast("Limits saved."); })));
  el.querySelectorAll("[data-revoke]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/agent-keys/${b.dataset.revoke}`); toast("Key revoked."); agents(); })));
}

// ------------------------------------------------------------------ passkeys
async function security() {
  const el = $("#tab-security");
  const { passkeys } = await api("GET", "/api/passkeys");
  const supported = !!window.PublicKeyCredential;
  el.innerHTML = `
    <div class="card"><h3>Passkeys</h3>
      <p class="small muted">Approvals for subscriptions, renewals and large calls are signed with a passkey on your phone, laptop or security key.
      Your agents can request spending but can never approve it: a passkey needs you, in person, on your device.</p>
      ${supported ? "" : `<p style="color:var(--bad)">This browser doesn't support passkeys.</p>`}
      <div class="row"><input id="dev" placeholder="Device name, e.g. Work laptop"><button class="primary" id="add" ${supported ? "" : "disabled"}>Add a passkey</button></div>
    </div>
    <div class="card"><table><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr>
      ${passkeys.map((p) => `<tr><td>${esc(p.deviceName)}</td><td class="small">${date(p.createdAt)}</td><td class="small">${date(p.lastUsedAt) || "never"}</td>
        <td><button class="danger" data-del="${esc(p.id)}">Remove</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">No passkeys yet.</td></tr>`}
    </table></div>`;
  $("#add").onclick = act(async () => {
    const options = await api("POST", "/api/passkeys/register/start");
    const response = await startRegistration({ optionsJSON: options });
    await api("POST", "/api/passkeys/register/finish", { response, deviceName: $("#dev").value || navigator.platform || "Passkey" });
    toast("Passkey added."); await refreshCounts(); security();
  });
  el.querySelectorAll("[data-del]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/passkeys/${encodeURIComponent(b.dataset.del)}`); await refreshCounts(); security(); })));
}

// ------------------------------------------------------------------ provider
async function provider() {
  const el = $("#tab-provider");
  const { providers } = await api("GET", "/api/providers");
  if (!providers.length) {
    el.innerHTML = `<div class="card"><h3>Sell tools and plans to agents</h3><p class="small muted">List an API as a paid tool; agents pay per call, and you can sell subscription plans that include calls.</p>
      <div class="row"><input id="pname" placeholder="Business name"><button class="primary" id="mk">Become a provider</button></div></div>`;
    $("#mk").onclick = act(async () => { await api("POST", "/api/providers", { name: $("#pname").value }); provider(); });
    return;
  }
  const d = await api("GET", `/api/providers/${providers[0].id}`);
  const pid = d.provider.id;
  el.innerHTML = `
    <div class="card spread"><div><div class="muted small">${esc(d.provider.name)} · earnings available</div><div class="big">${usd(d.earningsCents)}</div></div>
      <div class="row"><button id="payout" ${d.earningsCents > 0 ? "" : "disabled"}>Request payout of ${usd(d.earningsCents)}</button></div></div>
    <div class="card"><h3>Tools</h3><div class="table-wrap"><table><tr><th>Tool</th><th>Pricing</th><th>Endpoint</th><th></th></tr>
      ${d.tools.map((t) => `<tr><td><b>${esc(t.slug)}</b><div class="small muted">${esc(t.description)}</div></td>
        <td class="small">${t.pricing.type === "per_call" ? usd(t.pricing.priceCents) + " / call" : usd(t.pricing.priceCentsPerUnit) + " / " + esc(t.pricing.unitsField)}</td>
        <td class="small muted">${esc(t.upstreamUrl)}</td><td><button data-tool="${esc(t.slug)}" data-active="${t.active}">${t.active ? "Pause" : "Resume"}</button></td></tr>`).join("")}
    </table></div>
      <div class="grid" id="newtool" style="margin-top:10px">
        <label>Slug<input name="slug" placeholder="my-api"></label><label>Name<input name="name"></label>
        <label>Price per call ($)<input name="price" type="number" step="0.01" min="0" value="0.05"></label>
        <label>Endpoint URL<input name="url" placeholder="https://api.example.com/agentpay"></label>
        <label>Authorization header<input name="auth" placeholder="Bearer secret"></label>
        <label>Description<input name="desc"></label>
      </div><div class="row" style="margin-top:8px"><button id="addtool">Add tool</button></div>
    </div>
    <div class="card"><h3>Plans</h3><div class="table-wrap"><table><tr><th>Plan</th><th>Category</th><th class="num">Price</th><th>Includes</th><th></th></tr>
      ${d.plans.map((p) => `<tr><td><b>${esc(p.name)}</b> <span class="small muted">${esc(p.slug)}</span></td><td>${esc(p.category)}</td>
        <td class="num">${usd(p.priceCents)}/${p.interval}</td><td class="small">${p.includedCalls ? p.includedCalls + " × " + esc(p.toolSlug) : "—"}</td>
        <td><button data-plan="${esc(p.slug)}" data-active="${p.active}">${p.active ? "Retire" : "Restore"}</button></td></tr>`).join("")}
    </table></div>
      <div class="grid" id="newplan" style="margin-top:10px">
        <label>Slug<input name="slug"></label><label>Name<input name="name"></label><label>Category<input name="category" placeholder="weather"></label>
        <label>Price ($)<input name="price" type="number" step="0.01" min="0.01"></label>
        <label>Every<select name="interval"><option>month</option><option>week</option><option>year</option></select></label>
        <label>Includes calls to tool<select name="tool"><option value="">none</option>${d.tools.filter((t) => t.pricing.type === "per_call").map((t) => `<option>${esc(t.slug)}</option>`).join("")}</select></label>
        <label>Included calls<input name="calls" type="number" min="1"></label><label>Features (comma-separated)<input name="features"></label>
      </div><div class="row" style="margin-top:8px"><button id="addplan">Add plan</button></div>
    </div>
    <div class="card"><h3>Payouts</h3><table>${d.payouts.map((p) => `<tr><td>${date(p.createdAt)}</td><td class="num">${usd(p.amountCents)}</td><td><span class="chip">${p.status}</span></td></tr>`).join("") || `<tr><td class="muted">No payouts yet.</td></tr>`}</table></div>`;
  $("#payout").onclick = act(async () => { await api("POST", `/api/providers/${pid}/payouts`, { amountCents: d.earningsCents }); toast("Payout requested."); provider(); });
  $("#addtool").onclick = act(async () => {
    const f = (n) => $(`#newtool [name=${n}]`).value.trim();
    await api("POST", `/api/providers/${pid}/tools`, { slug: f("slug"), name: f("name"), description: f("desc") || f("name"), pricingType: "per_call", priceCents: toCents(f("price")), upstreamUrl: f("url"), upstreamAuth: f("auth") || undefined });
    toast("Tool listed."); provider();
  });
  $("#addplan").onclick = act(async () => {
    const f = (n) => $(`#newplan [name=${n}]`).value.trim();
    await api("POST", `/api/providers/${pid}/plans`, { slug: f("slug"), name: f("name"), description: f("features") || f("name"), category: f("category"), priceCents: toCents(f("price")), interval: f("interval"),
      toolSlug: f("tool") || undefined, includedCalls: f("tool") ? Number(f("calls")) : undefined, features: f("features") ? f("features").split(",").map((s) => s.trim()) : [] });
    toast("Plan listed."); provider();
  });
  el.querySelectorAll("[data-tool]").forEach((b) => (b.onclick = act(async () => { await api("PATCH", `/api/providers/${pid}/tools/${b.dataset.tool}`, { active: b.dataset.active !== "true" }); provider(); })));
  el.querySelectorAll("[data-plan]").forEach((b) => (b.onclick = act(async () => { await api("PATCH", `/api/providers/${pid}/plans/${b.dataset.plan}`, { active: b.dataset.active !== "true" }); provider(); })));
}

boot();
</script>
</body>
</html>
