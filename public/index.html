<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPay</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #2f5bea; --accent-text: #fff; --ok: #137a3f; --warn: #a15c00; --bad: #b42318; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e8eaef; --muted: #98a1b0; --line: #2a2f3a;
      --accent: #6d8dff; --accent-text: #0f1115; --ok: #4cc38a; --warn: #f0a94b; --bad: #ff7a6e; --chip: #222733; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; }
  header .balance { margin-left: auto; font-variant-numeric: tabular-nums; }
  nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
  nav a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  nav a.active { background: var(--chip); color: var(--text); font-weight: 600; }
  nav a .count { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  section { display: none; } section.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spread { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .big { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--ok); } .neg { color: var(--text); }
  .chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .table-wrap { overflow-x: auto; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; display: none; max-width: calc(100% - 32px); z-index: 5; }
  .login { max-width: 420px; margin: 60px auto; }
  .suggestion { border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; }
  button.kill { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 650; padding: 10px 18px; }
  .terms { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .terms ul { margin: 4px 0 0; padding-left: 18px; }
  .rule input { width: 120px; }
  s.refused { color: var(--muted); }
  header { flex-wrap: wrap; row-gap: 8px; }
  header .count, .cnt { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; margin-left: 4px; }
  .helping-banner { background: var(--chip); border-bottom: 2px solid var(--warn); padding: 10px 20px; font-size: 14px; }
  .code-box { border: 2px dashed var(--accent); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .code-box pre { font-size: 16px; user-select: all; margin: 6px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="/vendor/simplewebauthn-browser.js"></script>
<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (c) => (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
const toCents = (v) => (v === "" || v == null ? null : Math.round(Number(v) * 100));
const fromCents = (c) => (c == null ? "" : (c / 100).toFixed(2));
const date = (d) => (d ? new Date(d).toLocaleString() : "");

let token = null;
try { token = localStorage.getItem("agentpay.token"); } catch {}
let me = null;
let tab = location.hash.slice(1) || "board";
// An invitation link (#accept=<code>): keep the code in memory only, open the Family tab, and take it out of the address bar.
let pendingInvite = null;
if (tab.startsWith("accept=")) {
  pendingInvite = decodeURIComponent(tab.slice(7));
  tab = "family";
  history.replaceState(null, "", "#family");
}
// Trusted helper mode: the ownerId of the account we're helping, or null for our own account.
let acting = null;
try { acting = sessionStorage.getItem("agentpay.acting") || null; } catch {}
let fam = null; // last GET /api/family (always about our own account)
function setActing(id) {
  acting = id || null;
  try { acting ? sessionStorage.setItem("agentpay.acting", acting) : sessionStorage.removeItem("agentpay.acting"); } catch {}
}
const actingName = () => { const h = fam?.helping?.find((x) => x.ownerId === acting); return h ? h.name || h.email : me?.user?.email ?? "this account"; };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4000);
}

/** opts.own: always about our own account, even while helping someone. */
async function api(method, path, body, opts = {}) {
  const res = await fetch(path, {
    method, headers: { ...(token ? { authorization: "Bearer " + token } : {}), ...(body ? { "content-type": "application/json" } : {}),
      ...(acting && !opts.own ? { "x-agentpay-account": acting } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error?.message || "HTTP " + res.status), { code: json.error?.code, details: json.error?.details });
  return json;
}
const act = (fn) => async (e) => { const b = e?.currentTarget; if (b) b.disabled = true; try { await fn(e); } catch (err) { toast(err.message); } finally { if (b) b.disabled = false; } };

// ------------------------------------------------------------------ login
function renderLogin() {
  $("#app").innerHTML = `
    <div class="login card">
      <h3>AgentPay</h3>
      <p class="muted small">A prepaid wallet for your AI agents. You set the limits; they pay for tools and subscriptions; you approve big spending with your passkey.</p>
      <label>Owner token<input id="tok" placeholder="ap_owner_..." autocomplete="off"></label>
      <div class="row" style="margin-top:8px"><button class="primary" id="signin">Sign in</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <label>New account email<input id="email" type="email" placeholder="you@example.com"></label>
      <div class="row" style="margin-top:8px"><button id="signup">Create account</button></div>
      <div id="newtok"></div>
    </div>`;
  $("#signin").onclick = act(async () => { token = $("#tok").value.trim(); setActing(null); await boot(); });
  $("#signup").onclick = act(async () => {
    const r = await api("POST", "/api/signup", { email: $("#email").value.trim() });
    $("#newtok").innerHTML = `<p class="small">Your owner token (shown once; store it in a password manager):</p><pre>${esc(r.token)}</pre>`;
    $("#tok").value = r.token;
  });
}

// ------------------------------------------------------------------ shell
const tabs = [["board", "Control"], ["family", "Family"], ["all", "All subscriptions"], ["watch", "Price watch"], ["grocery", "Groceries"], ["perms", "Permissions"], ["wallet", "Wallet"], ["approvals", "Approvals"], ["subscriptions", "Agent plans"], ["agents", "Agent keys"], ["security", "Passkeys"], ["provider", "Sell tools"]];

// A trusted helper sees only these tabs on someone else's account.
const helperTabs = ["board", "approvals", "all"];
const visibleTabs = () => tabs.filter(([k]) => (acting ? helperTabs.includes(k) : true));

async function boot() {
  if (!token) return renderLogin();
  try { me = await api("GET", "/api/me"); } catch {
    if (acting) { setActing(null); return boot(); } // no longer a helper there: back to our own account
    token = null; try { localStorage.removeItem("agentpay.token"); } catch {} return renderLogin();
  }
  try { localStorage.setItem("agentpay.token", token); } catch {}
  try { fam = await api("GET", "/api/family", undefined, { own: true }); } catch { fam = null; }
  const vis = visibleTabs();
  $("#app").innerHTML = `
    <header><h1>AgentPay</h1><span class="muted small">${esc(me.signer?.email ?? me.user.email)}</span>
      <span class="balance" id="bal"></span><span id="acct"></span><button id="logout">Sign out</button></header>
    <nav>${vis.map(([k, v]) => `<a href="#${k}" data-tab="${k}">${v}<span id="count-${k}"></span></a>`).join("")}</nav>
    ${acting ? `<div class="helping-banner">You're helping <b>${esc(actingName())}</b> as a trusted helper. You can see their account, freeze it, and co-sign or object to big approvals.
      You can't spend or change settings. <a href="#" id="backown">Back to my account</a></div>` : ""}
    <main>${vis.map(([k]) => `<section id="tab-${k}"></section>`).join("")}</main>`;
  $("#logout").onclick = () => { try { localStorage.removeItem("agentpay.token"); } catch {} token = null; setActing(null); renderLogin(); };
  if ($("#backown")) $("#backown").onclick = (e) => { e.preventDefault(); switchAccount(null); };
  renderSwitcher();
  if (!boot.started) {
    boot.started = true;
    const params = new URLSearchParams(location.search);
    if (params.get("topup") === "success") toast("Payment received. Credits appear as soon as Stripe confirms it.");
    if (params.get("topup") === "cancelled") toast("Top-up cancelled.");
    setInterval(refreshCounts, 60000);
  }
  show(tab);
  refreshCounts();
}

/** Switch between our own account and an account we help; re-renders everything. */
async function switchAccount(ownerId) {
  setActing(ownerId);
  if (ownerId && !helperTabs.includes(tab)) { tab = "board"; history.replaceState(null, "", "#board"); }
  await boot();
}

const helpCount = (h) => (h.unseenAlerts || 0) + (h.waitingForCosign || 0);
function renderSwitcher() {
  const el = $("#acct");
  if (!el) return;
  const helping = fam?.helping ?? [];
  if (!helping.length && !acting) { el.innerHTML = ""; return; }
  const total = helping.reduce((t, h) => t + helpCount(h), 0);
  el.innerHTML = `<select id="acctsel" aria-label="Account" style="max-width:220px">
      <option value="">My account</option>
      ${helping.map((h) => `<option value="${esc(h.ownerId)}" ${h.ownerId === acting ? "selected" : ""}>${esc(h.name || h.email)}${helpCount(h) ? ` (${helpCount(h)})` : ""}</option>`).join("")}
      ${acting && !helping.some((h) => h.ownerId === acting) ? `<option value="${esc(acting)}" selected>${esc(actingName())}</option>` : ""}
    </select>${total && !acting ? `<span class="cnt" title="New alerts and approvals waiting for your co-signature">${total}</span>` : ""}`;
  $("#acctsel").onchange = act(async (e) => switchAccount(e.target.value || null));
}

window.addEventListener("hashchange", () => token && me && show(location.hash.slice(1) || "board"));

async function refreshCounts() {
  try {
    me = await api("GET", "/api/me");
    $("#bal").innerHTML = `<span class="muted small">${acting ? "Their balance" : "Balance"}</span> <b>${usd(me.balanceCents)}</b>`;
    if (!acting) {
      fam = await api("GET", "/api/family", undefined, { own: true }).catch(() => fam);
      const n = (fam?.helping ?? []).reduce((t, h) => t + helpCount(h), 0);
      if ($("#count-family")) $("#count-family").innerHTML = n ? `<span class="count">${n}</span>` : "";
      renderSwitcher();
    }
    const { approvals } = await api("GET", "/api/approvals?status=pending");
    $("#count-approvals").innerHTML = approvals.length ? `<span class="count">${approvals.length}</span>` : "";
    const b = await api("GET", "/api/controls/board");
    const n = b.toReview.length + b.openIncidents.length;
    $("#count-board").innerHTML = b.frozenAt ? `<span class="count">frozen</span>` : n ? `<span class="count">${n}</span>` : "";
  } catch {}
}

function show(name) {
  tab = visibleTabs().some(([k]) => k === name) ? name : "board";
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("active", s.id === "tab-" + tab));
  ({ board, family: familyTab, all, watch, grocery, perms, wallet, approvals, subscriptions, agents, security, provider })[tab]().catch((e) => toast(e.message));
}

// ------------------------------------------------------------------ control board
const incidentKinds = [["misjudgment", "Agent misjudged"], ["condition_breach", "Broke my conditions"], ["system_bug", "AgentPay bug"], ["hijacked", "Agent was hijacked"], ["unclassified", "Not sure yet"]];
const stateChip = (s) => `<span class="chip ${["active", "watching"].includes(s) ? "ok" : ["pending", "requested", "waiting", "trial", "cancel_requested", "pending_approval"].includes(s) ? "warn" : ""}">${esc(String(s).replaceAll("_", " "))}</span>`;
const stopBtn = (s, label = "Stop", confirmText = "") => acting ? "" : `<button class="danger" data-stop-m="${esc(s.method)}" data-stop-p="${esc(s.path)}"${confirmText ? ` data-confirm="${esc(confirmText)}"` : ""}>${label}</button>`;
const group = (title, head, rows, empty) => `<h3 style="margin-top:14px">${title}</h3><div class="table-wrap"><table><tr>${head.map((h) => `<th>${h}</th>`).join("")}<th></th></tr>
  ${rows.join("") || `<tr><td colspan="${head.length + 1}" class="muted small">${empty}</td></tr>`}</table></div>`;

async function board() {
  const el = $("#tab-board");
  const [b, guarantee, policy, { entries }] = await Promise.all([api("GET", "/api/controls/board"), acting ? null : api("GET", "/api/controls/guarantee"),
    api("GET", "/api/controls/policy"), api("GET", "/api/controls/audit")]);
  const lim = (l) => [l.perCallMaxCents != null && `${usd(l.perCallMaxCents)}/call`, l.dailyCapCents != null && `${usd(l.dailyCapCents)}/24h`,
    l.monthlyCapCents != null && `${usd(l.monthlyCapCents)}/30d`, l.approvalThresholdCents != null && `asks above ${usd(l.approvalThresholdCents)}`].filter(Boolean).join(" · ") || "no limits";
  el.innerHTML = `
    <div class="card" style="border:2px solid var(--bad)">
      ${b.frozenAt ? `<div class="spread"><div><h3 style="color:var(--bad)">Frozen since ${date(b.frozenAt)}</h3>
          <p class="small">No agent can spend, AgentPay renewals are paused and pending approvals were declined. ${acting ? "Only the owner can start an unfreeze; you can co-sign it under Approvals." : "Unfreezing needs your passkey."}</p></div>
          ${acting ? "" : `<button class="primary" id="unfreeze">Unfreeze…</button>`}</div>`
        : `<div class="spread"><div><h3>Kill switch</h3><p class="small muted">Stops every agent at once, declines all pending approvals and pauses AgentPay renewals. No passkey needed; unfreezing later does need one${acting ? " and can only be started by the owner" : ""}.</p></div>
          <button class="kill" id="freeze">Freeze everything</button></div>`}
    </div>
    ${b.toReview.length ? `<div class="card"><h3>To review</h3><p class="small muted">These calls went through on their own but were flagged for you to look at.</p><div class="table-wrap"><table>
      <tr><th>Call</th><th class="num">Amount</th><th>Why flagged</th><th></th></tr>
      ${b.toReview.map((c) => `<tr><td><b>${esc(c.tool)}</b><div class="small muted">${esc(c.agentKeyName)} · ${date(c.createdAt)}</div>${c.agentReason ? `<div class="small">Agent's reason: “${esc(c.agentReason)}”</div>` : ""}</td>
        <td class="num">${usd(c.amountCents)}</td><td class="small">${esc(c.decidedBecause ?? "")}</td>
        <td class="row">${acting ? "" : `<button data-review-ok="${esc(c.id)}">Looks right</button><button class="danger" data-review-bad="${esc(c.id)}">Report problem</button>`}</td></tr>`).join("")}
    </table></div></div>` : ""}
    ${b.reminders.length ? `<div class="card"><h3>Coming up</h3>${b.reminders.map((r) => `<div class="suggestion spread" style="border-color:var(--warn)"><div>${esc(r.message)}<div class="small muted">${esc(r.on)} · ${r.daysLeft} days</div></div>
      <div class="row">${acting ? "" : r.actions.includes("request_cancel") ? `<button data-rcancel="${esc(r.subscriptionId)}">Cancel…</button>` : ""}${acting || !r.actions.includes("accept_price") ? "" : `<button data-accept="${esc(r.subscriptionId)}">Keep new price</button>`}</div></div>`).join("")}</div>` : ""}
    ${b.openPurchases?.length ? `<div class="card"><h3>Orders</h3><p class="small muted">Each order stays open until you confirm what arrived. Return dates follow the store's usual policy; correct them if yours differs.</p>
      ${b.purchaseReminders.map((r) => `<div class="suggestion" style="border-color:var(--warn)">${esc(r.message)}</div>`).join("")}
      <div class="table-wrap"><table><tr><th>Order</th><th>Store</th><th class="num">Total</th><th>Return by</th><th>Status</th><th></th></tr>
      ${b.openPurchases.map((p) => `<tr><td>${esc(p.title)}${p.orderNumber ? `<div class="small muted">#${esc(p.orderNumber)}</div>` : ""}${p.missingItems?.length ? `<div class="small" style="color:var(--bad)">Missing: ${esc(p.missingItems.join(", "))}</div>` : ""}</td>
        <td>${esc(p.store)}</td><td class="num">${p.totalCents != null ? usd(p.totalCents) : ""}</td><td>${esc(p.returnBy)} <span class="small muted">(${p.daysLeft} days)</span></td><td>${stateChip(p.status)}</td>
        <td class="row">${acting ? "" : `${p.status === "ordered" ? `<button data-arrived="${esc(p.id)}">Everything arrived</button><button data-missing="${esc(p.id)}">Something's missing</button>` : ""}<button data-returned="${esc(p.id)}">Returned</button><button data-returnby="${esc(p.id)}">Change date</button><button data-pclose="${esc(p.id)}">Close</button>`}</td></tr>`).join("")}
      </table></div></div>` : ""}
    <div class="card"><h3>Everything that can spend your money</h3>
      <p class="small muted">${b.pendingApprovals ? `<a href="#approvals">${b.pendingApprovals} waiting for approval</a> · ` : ""}Subscriptions ${usd(b.subscriptionTotals.monthlyCents)}/month (${usd(b.subscriptionTotals.yearlyCents)} a year)</p>
      ${group("Agents", ["Agent", "Level", "Spent", "Limits"], b.agents.map((a) => `<tr><td><b>${esc(a.name)}</b>${a.coolingOffUntil ? `<div class="small" style="color:var(--warn)">cooling off until ${date(a.coolingOffUntil)}</div>` : ""}</td>
        <td><span class="chip">${esc(a.levelLabel ?? a.level)}</span></td><td class="small">${usd(a.spentLast24hCents)} in 24h<br>${usd(a.spentLast30dCents)} in 30 days</td>
        <td class="small">${lim(a.limits)}${a.spendRules?.length ? `<br>${a.spendRules.length} spend rule${a.spendRules.length > 1 ? "s" : ""}` : ""}${a.observeAboveCents != null ? `<br>flags above ${usd(a.observeAboveCents)}` : ""}</td>
        <td>${stopBtn(a.stop, "Revoke", `Revoke the agent key "${a.name}"? The agent stops working immediately and the key can't be restored.`)}</td></tr>`), "No active agent keys.")}
      ${group("Envelopes", ["Envelope", "Left", "Status", "Ends"], b.envelopes.map((e) => `<tr><td><b>${esc(e.name)}</b><div class="small muted">${esc(e.purpose ?? "")}${e.agentKeyName ? " · " + esc(e.agentKeyName) : " · any agent"}${e.toolSlugs?.length ? " · " + esc(e.toolSlugs.join(", ")) : ""}</div></td>
        <td class="num">${usd(e.balanceCents)} <span class="small muted">of ${usd(e.amountCents)}</span></td><td>${stateChip(e.status)}</td><td class="small">${date(e.expiresAt)}</td>
        <td>${stopBtn(e.stop, "Close")}</td></tr>`), "No envelopes.")}
      ${group("Browser permissions", ["Site", "Allowed to", "Until"], b.browserPermissions.map((g) => `<tr><td><b>${esc(g.site)}</b><div class="small muted">${esc(g.purpose ?? "")}${g.agentKeyName ? " · " + esc(g.agentKeyName) : ""}</div></td>
        <td class="small">${g.actions.map((a) => esc(actionLabels[a] ?? a)).join(", ")}</td><td class="small">${date(g.expiresAt)}</td><td>${stopBtn(g.stop, "Revoke")}</td></tr>`), "No sites allowed.")}
      ${group("Buy mandates", ["Item", "Up to", "State", "Until"], b.buyMandates.map((m) => `<tr><td><b>${esc(m.title)}</b><div class="small muted">${esc(m.site)}</div></td>
        <td class="num">${usd(m.maxPriceCents)} × ${esc(m.quantity)}</td><td>${stateChip(m.state)}</td><td class="small">${date(m.expiresAt)}</td><td>${m.state === "active" ? stopBtn(m.stop, "Revoke") : ""}</td></tr>`), "No agent may buy anything for you.")}
      ${group("Subscriptions", ["Subscription", "Price", "Status", "Next charge"], b.subscriptions.map((s) => `<tr><td><b>${esc(s.name)}</b><div class="small muted">${s.kind === "agentpay" ? "AgentPay wallet" : "billed by the merchant"}</div></td>
        <td class="num">${usd(s.priceCents)}/${esc(s.interval)}</td><td>${stateChip(s.status)}</td><td class="small">${esc(s.nextRenewalOn ?? "")}</td>
        <td>${s.kind === "external" ? stopBtn(s.stop, "Cancel…") : stopBtn(s.stop, "Cancel")}</td></tr>`), "No subscriptions.")}
    </div>

          <div class="small">${i.guarantee?.eligible ? `<span class="chip ok">covered up to ${usd(i.guarantee.upToCents)}</span> ` : ""}${esc(i.guarantee?.why ?? "")}</div></td>
        ${acting ? `<td><span class="chip">${esc((incidentKinds.find(([k]) => k === i.kind) ?? [, i.kind])[1])}</span></td><td></td>`
          : `<td><select data-kind="${esc(i.id)}">${incidentKinds.map(([k, l]) => `<option value="${k}" ${k === i.kind ? "selected" : ""}>${l}</option>`).join("")}</select></td>
        <td><button data-resolve="${esc(i.id)}">Resolved</button></td>`}</tr>`).join("") || `<tr><td class="muted small">No open incidents.</td></tr>`}
    </table></div>
      ${guarantee ? `<details style="margin-top:8px"><summary class="small muted">${guarantee.offered ? "Our guarantee" : "What we cover"}</summary>${guarantee.text.map((t) => `<p class="small">${esc(t)}</p>`).join("")}</details>` : ""}
    </div>
    <div class="card"><div class="spread"><h3>Why log</h3><button id="verify">Verify chain</button></div><div id="verifyres"></div>
      <p class="small muted">Every action, who took it, on whose instruction and why. Entries are chained so they can't be changed afterwards.</p>
      <div class="table-wrap" style="max-height:420px;overflow-y:auto"><table><tr><th>#</th><th>When</th><th>Who</th><th>What</th></tr>
      ${[...entries].sort((x, y) => y.seq - x.seq).slice(0, 200).map((e) => `<tr><td class="small muted">${esc(e.seq)}</td><td class="small muted">${date(e.createdAt)}</td>
        <td class="small">${esc(e.agentKeyName || e.actor)}</td><td><span class="chip">${esc(e.kind)}</span> ${esc(e.summary)}
        ${e.instruction ? `<div class="small muted">Instruction: ${esc(e.instruction)}</div>` : ""}${e.reason ? `<div class="small muted">Why: ${esc(e.reason)}</div>` : ""}${e.result ? `<div class="small muted">Result: ${esc(e.result)}</div>` : ""}</td></tr>`).join("") || `<tr><td colspan="4" class="muted small">Nothing yet.</td></tr>`}
      </table></div></div>
    <div class="card"><h3>What agents must refuse</h3>
      <p class="small muted">Agents won't buy these, whatever their limits. This can't be turned off; buy these yourself.</p>
      <div class="row">${policy.refused.map((r) => `<span class="chip bad">${esc(r.label)}</span>`).join("")}</div>
      ${policy.note ? `<p class="small muted">${esc(policy.note)}</p>` : ""}
    </div>`;

  const on = (sel, fn) => $(sel) && ($(sel).onclick = act(fn));
  const passkeyThen = async (approvalId, msg) => { if (await approveWithPasskey(approvalId)) toast(msg); await refreshCounts(); board(); };
  const cancelMsg = "Cancellation approved. Follow the steps under All subscriptions › How to cancel.";
  on("#freeze", async () => { const r = await api("POST", "/api/controls/freeze", {}); toast(`Frozen. ${r.declined ?? 0} pending approval${r.declined === 1 ? "" : "s"} declined.`); await refreshCounts(); board(); });
  on("#unfreeze", async () => passkeyThen((await api("POST", "/api/controls/unfreeze", {})).approvalId, "Unfrozen. Agents can spend again within their limits."));
  el.querySelectorAll("[data-stop-p]").forEach((btn) => (btn.onclick = act(async () => {
    if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;
    const m = btn.dataset.stopM;
    const r = await api(m, btn.dataset.stopP, m === "POST" ? {} : undefined);
    if (r?.approvalId) return passkeyThen(r.approvalId, cancelMsg);
    toast("Stopped."); await refreshCounts(); board();
  })));
  el.querySelectorAll("[data-review-ok]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/controls/reviews/${btn.dataset.reviewOk}`, { ok: true }); await refreshCounts(); board(); })));
  el.querySelectorAll("[data-arrived]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/purchases/${btn.dataset.arrived}/received`, {}); toast("Marked as received."); board(); })));
  el.querySelectorAll("[data-missing]").forEach((btn) => (btn.onclick = act(async () => {
    const what = prompt("What's missing or wrong? (separate items with commas)");
    if (!what) return;
    const r = await api("POST", `/api/purchases/${btn.dataset.missing}/received`, { missingItems: what.split(",").map((s) => s.trim()).filter(Boolean) });
    toast(r.next ?? "Recorded."); board();
  })));
  el.querySelectorAll("[data-returned]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/purchases/${btn.dataset.returned}/returned`, {}); board(); })));
  el.querySelectorAll("[data-pclose]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/purchases/${btn.dataset.pclose}/close`, {}); board(); })));
  el.querySelectorAll("[data-returnby]").forEach((btn) => (btn.onclick = act(async () => {
    const d = prompt("New last day to return (YYYY-MM-DD)");
    if (d) { await api("PATCH", `/api/purchases/${btn.dataset.returnby}`, { returnBy: d }); board(); }
  })));
  el.querySelectorAll("[data-review-bad]").forEach((btn) => (btn.onclick = act(async () => {
    const description = prompt("What went wrong?");
    if (description == null) return;
    await api("POST", `/api/controls/reviews/${btn.dataset.reviewBad}`, { ok: false, description: description || undefined });
    toast("Reported. It's listed under Incidents."); await refreshCounts(); board();
  })));
  el.querySelectorAll("[data-rcancel]").forEach((btn) => (btn.onclick = act(async () => passkeyThen((await api("POST", `/api/everyday/${btn.dataset.rcancel}/request-cancel`, {})).approvalId, cancelMsg))));
  el.querySelectorAll("[data-accept]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/everyday/${btn.dataset.accept}/accept-price`, {}); toast("Keeping it at the new price."); board(); })));
  on("#addenv", async () => {
    const f = (n) => $(`#newenv [name=${n}]`).value.trim();
    const { approvalId } = await api("POST", "/api/controls/envelopes", { name: f("name"), amountCents: toCents(f("amount")), days: Number(f("days")) || 30,
      purpose: f("purpose") || undefined, agentKeyId: f("agent") || null, toolSlugs: f("tools") ? f("tools").split(/[\s,]+/).filter(Boolean) : null });
    await passkeyThen(approvalId, "Envelope ready.");
  });
  on("#vlock", async () => { await api("POST", "/api/controls/vault/lock", { amountCents: toCents($("#vamt").value) }); toast("Locked in the vault."); await refreshCounts(); board(); });
  on("#vunlock", async () => passkeyThen((await api("POST", "/api/controls/vault/unlock", { amountCents: toCents($("#vamt").value) })).approvalId,
    `Unlock approved. The money is available after ${b.vault.unlockDelayHours} hours.`));
  el.querySelectorAll("[data-vcancel]").forEach((btn) => (btn.onclick = act(async () => { await api("POST", `/api/controls/vault/unlocks/${btn.dataset.vcancel}/cancel`, {}); board(); })));
  el.querySelectorAll("[data-kind]").forEach((s) => (s.onchange = act(async () => { await api("PATCH", `/api/controls/incidents/${s.dataset.kind}`, { kind: s.value }); board(); })));
  el.querySelectorAll("[data-resolve]").forEach((btn) => (btn.onclick = act(async () => {
    const resolution = prompt("How was it resolved?");
    if (resolution == null) return;
    await api("PATCH", `/api/controls/incidents/${btn.dataset.resolve}`, { resolved: true, resolution: resolution || undefined }); await refreshCounts(); board();
  })));
  on("#report", async () => {
    const description = prompt("What happened?");
    if (!description) return;
    const amount = prompt("How much money was involved ($)? Leave blank if none.");
    await api("POST", "/api/controls/incidents", { description, amountCents: toCents(amount?.trim()) ?? undefined });
    toast("Reported."); await refreshCounts(); board();
  });
  on("#verify", async () => {
    const v = await api("GET", "/api/controls/audit/verify");
    $("#verifyres").innerHTML = v.ok ? `<p class="small"><span class="chip ok">intact</span> All ${esc(v.entries)} entries check out.</p>`
      : `<p class="small" style="color:var(--bad)">Chain broken${v.brokenAt != null ? ` at entry ${esc(v.brokenAt)}` : ""}: ${esc(v.problem ?? "unknown problem")}</p>`;
  });
}

// ------------------------------------------------------------------ family: protected account and trusted helpers
const helperState = { invited: ["invite sent", "warn"], active: ["active", "ok"], removing: ["being removed", "warn"] };

async function familyTab() {
  const el = $("#tab-family");
  const f = (fam = await api("GET", "/api/family", undefined, { own: true }));
  const p = f.protection;
  el.innerHTML = `
    <div class="card"><h3>Protected account ${p.protectedAt ? `<span class="chip ok">on since ${esc(new Date(p.protectedAt).toLocaleDateString())}</span>` : `<span class="chip">off</span>`}</h3>
      <p class="small muted">You keep your money. A trusted helper can see your account, freeze it, and co-sign or object to big approvals, but can never spend, move money or approve anything alone.</p>

        Envelopes, browser permissions, buy mandates, unfreezing and vault unlocks always need the second signature.
        Tightening applies right away; turning protection off or loosening it waits out the delay, and your helpers are told.</p>
      ${f.scheduledChanges.length ? `<h3 style="margin-top:12px">Scheduled changes</h3><div class="table-wrap"><table>
        ${f.scheduledChanges.map((c) => `<tr><td>${esc(c.summary)}</td><td class="small muted">takes effect ${date(c.effectiveAt)}</td>
          <td><button class="danger" data-cancel-change="${esc(c.id)}">Cancel</button></td></tr>`).join("")}</table></div>` : ""}
    </div>
    <div class="card"><h3>Your name</h3>
      <p class="small muted">Shown to the people who help you, so they know whose account it is.</p>
      <div class="row"><input id="famname" placeholder="e.g. Rosa Alvarez" maxlength="80" value="${esc(f.displayName ?? "")}"><button id="savename">Save name</button></div>
    </div>
    <div class="card"><h3>Trusted helpers</h3>
      <div class="table-wrap"><table><tr><th>Helper</th><th>Status</th><th></th></tr>
        ${f.helpers.map((h) => { const [l, c] = helperState[h.status] ?? [h.status, ""]; return `<tr>
          <td><b>${esc(h.label)}</b><div class="small muted">${h.email ? esc(h.email) : `${h.contact ? `${h.deliveryStatus === "sent" ? "invitation sent to" : "invited:"} ${esc(h.contact)}` : "invite code given"}${h.deliveryStatus === "failed" ? ` <span class="chip bad">couldn't send</span>` : ""}${h.inviteExpiresAt ? ` · expires ${date(h.inviteExpiresAt)}` : ""}`}</div></td>
          <td><span class="chip ${c}">${esc(l)}</span>${h.removingAt ? `<div class="small muted">removed on ${date(h.removingAt)}</div>` : ""}</td>
          <td class="row">${h.status === "invited" ? `<button data-resend="${esc(h.id)}" data-label="${esc(h.label)}">${h.contact ? "Resend" : "New code"}</button>` : ""}${h.status === "removing" ? "" : `<button class="danger" data-rm-helper="${esc(h.id)}" data-label="${esc(h.label)}">Remove</button>`}</td></tr>`; }).join("")
          || `<tr><td colspan="3" class="muted small">No trusted helpers yet.</td></tr>`}
      </table></div>
      <div class="grid" style="margin-top:10px">
        <label>Their name<input id="helperlabel" placeholder="Maria (daughter)" maxlength="80"></label>
        <label>Send the invitation by<select id="invitehow">
          <option value="email">Email${f.inviteChannels?.email ? "" : " (you'll pass on the code)"}</option>
          <option value="phone">Text message${f.inviteChannels?.sms ? "" : " (you'll pass on the code)"}</option>
          <option value="code">Just give me a code</option></select></label>
        <label id="contactlabel">Email address<input id="helpercontact" type="email" placeholder="maria@example.com" maxlength="254" autocomplete="off"></label>
      </div>
      <div class="row"><button class="primary" id="invite">Invite a helper</button></div>
      <p class="small muted">An email invitation can only be accepted from an AgentPay account with that email address. A text invitation works for whoever has the code, so send it only to their own phone.</p>
      <div id="invitecode"></div>
    </div>
    <div class="card"><h3>Accounts you help</h3>
      <div class="table-wrap"><table>
        ${f.helping.map((h) => `<tr><td><b>${esc(h.name || h.email)}</b><div class="small muted">${h.name ? esc(h.email) + " · " : ""}you are ${esc(h.youAre)}</div>
            <div class="row" style="margin-top:4px">${h.frozenAt ? `<span class="chip bad">frozen</span>` : ""}${h.protectedAt ? `<span class="chip ok">protected</span>` : ""}
              ${h.unseenAlerts ? `<span class="chip warn">${esc(h.unseenAlerts)} new alert${h.unseenAlerts === 1 ? "" : "s"}</span>` : ""}
              ${h.waitingForCosign ? `<span class="chip warn">${esc(h.waitingForCosign)} waiting for your co-signature</span>` : ""}</div></td>
          <td class="row"><button class="primary" data-open-acct="${esc(h.ownerId)}">Open</button><button data-alerts="${esc(h.ownerId)}">Alerts</button>
            <button class="danger" data-leave="${esc(h.ownerId)}" data-name="${esc(h.name || h.email)}">Stop helping</button></td></tr>`).join("")
          || `<tr><td class="muted small">You don't help anyone yet.</td></tr>`}
      </table></div>
      <div id="famalerts"></div>
    </div>
    <div class="card"><h3>Accept an invitation</h3>
      <p class="small muted">Someone asked you to be their trusted helper? Paste the code they gave you.</p>
      ${pendingInvite ? `<p class="small" style="color:var(--warn)">You opened an invitation link. Check you're signed in to the right AgentPay account (for an email invitation, the one with that email address), then press Accept.</p>` : ""}
      <div class="row"><input id="invitein" placeholder="Invitation code" autocomplete="off" style="flex:1;min-width:180px" value="${esc(pendingInvite ?? "")}"><button class="primary" id="accept">Accept</button></div>
    </div>`;

  const on = (sel, fn) => $(sel) && ($(sel).onclick = act(fn));
  const again = async () => { await refreshCounts(); await familyTab(); };
  on("#saveprot", async () => {
    const v = (n) => $(`#prot [name=${n}]`);
    const r = await api("POST", "/api/family/protection", { enabled: v("enabled").checked, cosignThresholdCents: toCents(v("threshold").value.trim()) ?? undefined,
      cosignDelayHours: v("delay").value ? Number(v("delay").value) : undefined }, { own: true });
    toast(r.scheduled ? r.message ?? `Scheduled for ${date(r.effectiveAt)}.` : "Saved.");
    await again();
  });
  el.querySelectorAll("[data-cancel-change]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/family/changes/${b.dataset.cancelChange}`, undefined, { own: true }); toast("Cancelled."); await again(); })));
  on("#savename", async () => { await api("PUT", "/api/family/name", { name: $("#famname").value.trim() }, { own: true }); toast("Name saved."); });
  const how = $("#invitehow");
  if (how) how.onchange = () => {
    const v = how.value;
    $("#contactlabel").style.display = v === "code" ? "none" : "";
    $("#contactlabel").firstChild.textContent = v === "phone" ? "Mobile number" : "Email address";
    $("#helpercontact").type = v === "phone" ? "tel" : "email";
    $("#helpercontact").placeholder = v === "phone" ? "(555) 123-4567" : "maria@example.com";
  };
  const showCode = (label, r) => {
    $("#invitecode").innerHTML = `<div class="code-box"><b class="small">Invitation code for ${esc(label)} (shown once)</b>
      <pre id="codetext">${esc(r.code)}</pre>
      <div class="row"><button id="copycode">Copy code</button><span class="small muted">Expires in ${esc(r.expiresInDays)} days</span></div>
      <p class="small">${esc(r.note || "Give this to your helper; they accept it from their own AgentPay account.")}</p></div>`;
    $("#copycode").onclick = async () => { try { await navigator.clipboard.writeText(r.code); toast("Copied."); } catch { toast("Select the code and copy it."); } };

    if (!label) return toast("Give your helper a name first, like \"Maria (daughter)\".");
    const v = $("#invitehow").value;
    const contact = $("#helpercontact").value.trim();
    if (v !== "code" && !contact) return toast(v === "phone" ? "Enter their mobile number." : "Enter their email address.");
    const r = await api("POST", "/api/family/helpers", { label, ...(v === "email" ? { email: contact } : v === "phone" ? { phone: contact } : {}) }, { own: true });
    if (r.sentTo) toast(`Invitation sent to ${r.sentTo}.`);
    await refreshCounts(); await familyTab();
    showCode(label, r);
  });
  el.querySelectorAll("[data-resend]").forEach((b) => (b.onclick = act(async () => {
    const r = await api("POST", `/api/family/helpers/${b.dataset.resend}/resend`, {}, { own: true });
    if (r.sentTo) toast(`Invitation sent again to ${r.sentTo}. The old code no longer works.`);
    await familyTab();
    showCode(b.dataset.label, r);
  })));
  el.querySelectorAll("[data-rm-helper]").forEach((b) => (b.onclick = act(async () => {
    if (!confirm(`Remove ${b.dataset.label} as a trusted helper?`)) return;
    const r = await api("DELETE", `/api/family/helpers/${b.dataset.rmHelper}`, undefined, { own: true });
    toast(r.scheduled ? r.message ?? `Removed on ${date(r.effectiveAt)}.` : "Removed."); await again();
  })));
  el.querySelectorAll("[data-open-acct]").forEach((b) => (b.onclick = act(async () => switchAccount(b.dataset.openAcct))));
  el.querySelectorAll("[data-alerts]").forEach((b) => (b.onclick = act(async () => {
    const id = b.dataset.alerts;
    const { alerts } = await api("GET", `/api/family/helping/${id}/alerts`, undefined, { own: true });
    const h = f.helping.find((x) => x.ownerId === id);
    $("#famalerts").innerHTML = `<h3 style="margin-top:14px">Alerts for ${esc(h ? h.name || h.email : "")}</h3><div class="table-wrap" style="max-height:420px;overflow-y:auto"><table>
      <tr><th>When</th><th>Who</th><th>What</th></tr>
      ${[...alerts].sort((x, y) => y.seq - x.seq).map((a) => `<tr><td class="small muted">${date(a.createdAt)}</td><td class="small">${esc(a.actor)}</td>
        <td>${a.unseen ? `<span class="chip warn">new</span> ` : ""}<span class="chip">${esc(String(a.kind).replaceAll("_", " "))}</span> ${esc(a.summary)}
          ${a.reason ? `<div class="small muted">Why: ${esc(a.reason)}</div>` : ""}${a.result ? `<div class="small muted">Result: ${esc(a.result)}</div>` : ""}</td></tr>`).join("")
        || `<tr><td colspan="3" class="muted small">No alerts.</td></tr>`}</table></div>`;
    if (alerts.some((a) => a.unseen)) { await api("POST", `/api/family/helping/${id}/alerts/seen`, {}, { own: true }); await refreshCounts(); }
  })));
  el.querySelectorAll("[data-leave]").forEach((b) => (b.onclick = act(async () => {
    if (!confirm(`Stop helping ${b.dataset.name}? They'll be told, and you'll need a new invitation to help again.`)) return;
    await api("POST", `/api/family/helping/${b.dataset.leave}/leave`, {}, { own: true }); toast("You no longer help on that account."); await again();
  })));
  on("#accept", async () => {
    const code = $("#invitein").value.trim();
    if (!code) return toast("Paste the invitation code first.");
    const r = await api("POST", "/api/family/accept", { code }, { own: true });
    pendingInvite = null;
    toast(`You're now a trusted helper${r.label ? ` (as ${r.label})` : ""}. Find the account under Accounts you help.`); await again();
  });
}

// ------------------------------------------------------------------ all subscriptions
let catalog = null;
const billedLabel = { direct: "Card", apple: "Apple", google: "Google Play", amazon: "Amazon", carrier: "Phone bill", other: "Other", agentpay: "AgentPay wallet" };
const statusLabel = { active: ["active", "ok"], trial: ["free trial", "warn"], cancel_requested: ["cancel requested", "warn"], cancel_approved: ["cancel approved", "warn"],
  canceling: ["cancels at period end", "warn"], past_due: ["past due", "bad"], pending_approval: ["waiting for approval", "warn"], canceled: ["cancelled", "bad"] };

async function all() {
  const el = $("#tab-all");
  // A helper may only read the list itself (GET /api/everyday), not the catalog, suggestions or any change.
  if (!acting) catalog ??= await api("GET", "/api/everyday/catalog");
  const [data, { suggestions }] = await Promise.all([api("GET", "/api/everyday"), acting ? { suggestions: [] } : api("GET", "/api/everyday/suggestions")]);
  const cats = Object.entries(data.totals.byCategory).sort((a, b) => b[1] - a[1]);

async function watch() {
  const el = $("#tab-watch");
  const { watches, saleEvents } = await api("GET", "/api/price-watch?all=1");
  const live = watches.filter((w) => w.status === "watching" || w.status === "target_hit");
  const ended = watches.filter((w) => w.status === "bought" || w.status === "stopped");
  const mandates = Object.fromEntries(await Promise.all(live.map(async (w) => [w.id, (await api("GET", `/api/price-watch/${w.id}/mandates`)).mandates])));
  const chip = { watching: ["watching", ""], target_hit: ["target reached", "ok"], bought: ["bought", "ok"], stopped: ["stopped", "bad"] };
  el.innerHTML = `
    <div class="card"><h3>Upcoming sales</h3><div class="row">${saleEvents.map((e) => `<span class="chip">${esc(e.name)}: ${e.date ? `${esc(e.date)} (${e.daysAway} days)` : esc(e.window)}</span>`).join("")}</div></div>
    ${live.map((w) => `<div class="card">
      <div class="spread"><div><h3><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a> <span class="chip ${chip[w.status][1]}">${chip[w.status][0]}</span></h3>
        <div class="small muted">${esc(w.retailer)}${w.productKey ? " · " + esc(w.productKey) : ""}${w.expiresOn ? " · until " + esc(w.expiresOn) : ""}</div></div>
        <div class="row">
          <div><div class="small muted">Now</div><b>${w.currentPriceCents ? usd(w.currentPriceCents) : "?"}</b></div>
          <div><div class="small muted">Lowest</div><b>${w.lowestSeenCents ? usd(w.lowestSeenCents) : "?"}</b></div>
          <div><div class="small muted">Target</div><b>${usd(w.targetPriceCents)}</b></div>
        </div></div>
      ${w.advice.map((a) => `<div class="suggestion">${esc(a)}</div>`).join("")}
      ${w.alerts.slice(0, 3).map((a) => `<div class="small" style="color:${a.type === "price_up" ? "var(--muted)" : "var(--ok)"}">${date(a.createdAt)} · ${esc(a.message)}</div>`).join("")}
      <details style="margin-top:6px"><summary class="small muted">Price history (${w.history.length})</summary><table>
        ${w.history.map((p) => `<tr><td class="small">${date(p.observedAt)}</td><td class="num">${usd(p.priceCents)}</td><td class="small muted">${esc(p.source)}${p.note ? " · " + esc(p.note) : ""}</td></tr>`).join("")}</table></details>
      <div class="row" style="margin-top:8px">
        <input type="number" step="0.01" min="0.01" placeholder="Price you see ($)" data-price-input="${w.id}" style="width:150px"><button data-price="${w.id}">Record price</button>
        <input type="number" step="0.01" min="0.01" placeholder="New target ($)" data-target-input="${w.id}" style="width:140px"><button data-target="${w.id}">Change target</button>
        <button class="primary" data-bought="${w.id}">I bought it</button><button data-mandate="${w.id}">Let agent buy…</button><button class="danger" data-stop="${w.id}">Stop</button>
      </div>
      ${mandates[w.id]?.length ? `<table style="margin-top:8px">${mandates[w.id].map((m) => `<tr><td class="small">Agent may buy on ${esc(m.site)}</td><td class="num">up to ${usd(m.maxPriceCents)} × ${esc(m.quantity)}</td>
        <td>${stateChip(m.state)}</td><td>${m.state === "active" ? `<button class="danger" data-unmandate="${esc(m.id)}">Revoke</button>` : ""}</td></tr>`).join("")}</table>` : ""}
      </div>`).join("") || `<div class="card muted">Not watching anything yet.</div>`}
    <div class="card"><h3>Watch an item</h3>
      <p class="small muted">Paste a product link and the price you want to pay. Your agent checks the price in your own browser and records it; AgentPay never signs in to the store or buys for you.</p>
      <div class="grid" id="newwatch">
        <label>Product link<input name="url" placeholder="https://www.amazon.com/dp/..."></label>
        <label>Name<input name="title" placeholder="e.g. Sony headphones"></label>
        <label>Price now ($)<input name="current" type="number" step="0.01" min="0.01"></label>
        <label>Target price ($)<input name="target" type="number" step="0.01" min="0.01"></label>
        <label>Stop watching after<input name="until" type="date"></label>
      </div><div class="row" style="margin-top:8px"><button class="primary" id="addwatch">Watch</button></div>
    </div>
    ${ended.length ? `<div class="card"><h3>Done</h3><table>${ended.map((w) => `<tr><td>${esc(w.title)}</td><td><span class="chip ${chip[w.status][1]}">${chip[w.status][0]}</span></td>
      <td class="num">${w.boughtPriceCents ? usd(w.boughtPriceCents) : ""}</td></tr>`).join("")}</table></div>` : ""}`;
  $("#addwatch").onclick = act(async () => {
    const f = (n) => $(`#newwatch [name=${n}]`).value.trim();
    const r = await api("POST", "/api/price-watch", { url: f("url"), title: f("title") || undefined, targetPriceCents: toCents(f("target")),
      currentPriceCents: toCents(f("current")) ?? undefined, expiresOn: f("until") || undefined });
    toast(r.alerts?.[0]?.message ?? "Watching."); watch();
  });
  el.querySelectorAll("[data-price]").forEach((b) => (b.onclick = act(async () => {
    const r = await api("POST", `/api/price-watch/${b.dataset.price}/prices`, { priceCents: toCents($(`[data-price-input="${b.dataset.price}"]`).value) });
    toast(r.alerts[0]?.message ?? "Price recorded."); watch();
  })));
  el.querySelectorAll("[data-target]").forEach((b) => (b.onclick = act(async () => {
    await api("PATCH", `/api/price-watch/${b.dataset.target}`, { targetPriceCents: toCents($(`[data-target-input="${b.dataset.target}"]`).value) }); watch();
  })));
  el.querySelectorAll("[data-bought]").forEach((b) => (b.onclick = act(async () => { await api("POST", `/api/price-watch/${b.dataset.bought}/bought`, {}); toast("Nice. Marked as bought."); watch(); })));
  el.querySelectorAll("[data-stop]").forEach((b) => (b.onclick = act(async () => { await api("POST", `/api/price-watch/${b.dataset.stop}/stop`, {}); watch(); })));
  el.querySelectorAll("[data-mandate]").forEach((b) => (b.onclick = act(async () => {
    const max = prompt("Highest price the agent may pay, per item ($)?");
    if (!max) return;
    const qty = Number(prompt("How many?", "1"));
    if (!qty) return;
    const { approvalId } = await api("POST", `/api/price-watch/${b.dataset.mandate}/mandate`, { maxPriceCents: toCents(max.trim()), quantity: qty, days: 30 });
    if (await approveWithPasskey(approvalId)) toast("Your agent may buy it at or below that price for 30 days.");
    await refreshCounts(); watch();
  })));
  el.querySelectorAll("[data-unmandate]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/price-watch/mandates/${b.dataset.unmandate}`); toast("Revoked."); watch(); })));
}

/** Shrink a phone photo to at most 1600px on the long side, as JPEG, before uploading. */
async function photoToBase64(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
}

    <div class="card"><h3>New grocery list</h3>

// ------------------------------------------------------------------ approvals
// On a protected account an approval may need a second signature: the server then answers
// {status: "pending", message}. We show that message and return false (not done yet).
const signedButWaiting = (r) => { if (r?.status !== "pending") return false; toast(r.message ?? "Signed. Waiting for the second signature."); return true; };

// "Is someone on the phone with you?" Asked before the owner signs a big or sensitive approval on a protected account.
function askScamQuestions(questions) {
  const answers = {};
  for (const [key, q] of Object.entries(questions)) answers[key] = confirm(`Safety question\n\n${q}\n\nOK = Yes    Cancel = No`);
  if (Object.values(answers).some(Boolean)) {
    alert("Thank you for answering honestly. This has the signs of a scam, so your trusted helper will look at it before anything happens.\n\nReal banks, police and companies never ask you to keep a payment secret or to hurry.");
  }
  return answers;
}

async function approveWithPasskey(id) {
  if (!me.hasPasskey && me.requirePasskey) {
    if (acting) { toast("Add a passkey in your own account first (My account › Passkeys)."); return false; }
    toast("Register a passkey first (Passkeys tab)."); location.hash = "security"; return false;
  }
  if (!me.hasPasskey) {
    try {
      return !signedButWaiting(await api("POST", `/api/approvals/${id}/approve`, {}));
    } catch (err) {
      if (err.code !== "scam_check_required") throw err;
      return !signedButWaiting(await api("POST", `/api/approvals/${id}/approve`, { scamCheck: askScamQuestions(err.details.questions) }));
    }
  }
  const { summary, options, terms, scamCheck: questions } = await api("POST", `/api/approvals/${id}/start`);
  const scamCheck = questions ? askScamQuestions(questions) : undefined;
  // The final confirmation: every flow shows the full terms before the passkey prompt, not only the Approvals tab.
  if (!confirm(`${summary}\n\nBefore you approve:\n${(terms ?? []).map((t) => `• ${t}`).join("\n")}\n\nContinue to your passkey?`)) return false;
  toast("Confirm on your device: " + summary);
  const passkey = await startAuthentication({ optionsJSON: options });
  return !signedButWaiting(await api("POST", `/api/approvals/${id}/approve`, { passkey, scamCheck }));
}

// Kinds that always need a trusted helper's second signature on a protected account (mirrors the server).
const cosignKinds = ["unfreeze", "vault_unlock", "browser_access", "risk_consent", "envelope", "buy_mandate"];
const helperCanAct = (a) => !!me.protection?.protectedAt && (a.needsCosign || cosignKinds.includes(a.kind) || a.amountCents >= (me.protection.cosignThresholdCents ?? Infinity));
const cosignStatus = (a) => !a.needsCosign ? "" : a.helperSignedAt ? "Co-signed by a helper — waiting for the owner"
  : a.ownerSignedAt ? `Signed by owner — waiting for a trusted helper, or goes through on ${date(a.cosignDueAt)} unless a helper objects`
  : "Protected account: needs the owner's signature and a trusted helper's (or a wait)";

async function approvals() {
  const el = $("#tab-approvals");

      ${acting ? `<p class="small muted">As a trusted helper you can co-sign or object to approvals that need a second signature. Everything else is the owner's decision.</p>` : ""}
      ${pending.map((a) => `

          <div><b>${esc(a.summary)}</b>
            <div class="small muted">Requested by ${esc(a.agentKeyName || "you")} · ${date(a.createdAt)}</div>
            ${a.terms?.length ? `<div class="terms"><b class="small">Before you approve</b><ul class="small">${a.terms.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}

            ${a.kind === "call" ? `<div class="small muted">Input: <code>${esc(JSON.stringify(a.input).slice(0, 200))}</code></div>` : ""}
            ${a.needsCosign ? `<div class="small" style="color:var(--warn)">${esc(cosignStatus(a))}</div>` : ""}
          </div>
          <div class="row">${acting
            ? (helperCanAct(a) && !a.helperSignedAt ? `<button class="primary" data-approve="${esc(a.id)}">Co-sign</button><button class="danger" data-deny="${esc(a.id)}">Object</button>`
              : a.helperSignedAt ? "" : `<span class="small muted">Owner decides</span>`)
            : `${a.ownerSignedAt ? "" : `<button class="primary" data-approve="${esc(a.id)}">Approve with passkey</button>`}<button class="danger" data-deny="${esc(a.id)}">Deny</button>`}</div>
        </div>`).join("") || `<p class="muted">Nothing to approve.</p>`}
    </div>
    <div class="card"><h3>Recent decisions</h3><div class="table-wrap"><table>
      ${done.map((a) => `<tr><td>${esc(a.summary)}</td><td><span class="chip ${a.status === "denied" ? "bad" : "ok"}">${a.status}</span></td><td class="small muted">${date(a.decidedAt)}</td></tr>`).join("") || `<tr><td class="muted">None yet.</td></tr>`}
    </table></div></div>`;
  el.querySelectorAll("[data-approve]").forEach((b) => (b.onclick = act(async () => { if (await approveWithPasskey(b.dataset.approve)) toast(acting ? "Co-signed." : "Approved."); await refreshCounts(); approvals(); })));
  el.querySelectorAll("[data-deny]").forEach((b) => (b.onclick = act(async () => {
    if (acting && !confirm("Object to this approval? It will be declined.")) return;
    await api("POST", `/api/approvals/${b.dataset.deny}/deny`); if (acting) toast("Objected. The approval was declined."); await refreshCounts(); approvals();
  })));
}

// ------------------------------------------------------------------ agent keys
const limitFields = [["perCallMaxCents", "Max per call ($)"], ["dailyCapCents", "Max per 24h ($)"], ["monthlyCapCents", "Max per 30 days ($)"], ["approvalThresholdCents", "Ask me above ($)"]];

function readLimits(scope) {
  const out = {};
  for (const [k] of limitFields) out[k] = toCents($(`[name=${k}]`, scope).value);
  const tools = $("[name=allowedToolSlugs]", scope).value.trim();
  out.allowedToolSlugs = tools ? tools.split(/[\s,]+/).filter(Boolean) : null;
  out.level = $("[name=level]", scope).value;
  out.observeAboveCents = toCents($("[name=observeAboveCents]", scope).value);
  out.spendRules = [...scope.querySelectorAll(".rule")].map((r) => {
    const v = (n) => $(`[name=${n}]`, r).value.trim();
    return { name: v("rname"), tools: v("rtools") ? v("rtools").split(/[\s,]+/).filter(Boolean) : null, maxCents: toCents(v("rmax")) ?? 0, outcome: v("routcome") };
  }).filter((r) => r.name);
  return out;
}
const levels = [["ask", "L0 · ask me for everything"], ["rules", "L1 · follow my rules"], ["budget", "L2 · free within budget"]];
const ruleRow = (r = {}) => `<div class="row rule" style="margin-top:6px">

  <select name="routcome"><option value="auto" ${r.outcome !== "observe" ? "selected" : ""}>pay on its own</option><option value="observe" ${r.outcome === "observe" ? "selected" : ""}>pay, flag for review</option></select>

  const { agentKeys } = await api("GET", "/api/agent-keys");
  const limitInputs = (k = {}) => limitFields.map(([f, l]) => `<label>${l}<input name="${f}" type="number" min="0" step="0.01" value="${fromCents(k[f])}" placeholder="no limit"></label>`).join("") +
    `<label>Allowed tools<input name="allowedToolSlugs" value="${esc((k.allowedToolSlugs || []).join(", "))}" placeholder="all tools"></label>
    <label>Level<select name="level">${levels.map(([v, l]) => `<option value="${v}" ${v === (k.level ?? "budget") ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label>Flag for review above ($)<input name="observeAboveCents" type="number" min="0" step="0.01" value="${fromCents(k.observeAboveCents)}" placeholder="never"></label>
    <div style="grid-column:1/-1"><div class="small muted">Spend rules: what the agent may pay for on its own (tools blank = any tool)</div>
      <div class="rules">${(k.spendRules || []).map(ruleRow).join("")}</div><button class="small" data-add-rule style="margin-top:6px">+ Add rule</button></div>`;
  el.innerHTML = `
    <div class="card"><h3>New agent key</h3>
      <p class="small muted">Give each agent its own key so you can see, limit and revoke it separately.</p>
      ${me.protection?.protectedAt ? `<p class="small" style="color:var(--warn)">This is a protected account: new agents start at L0 (ask for everything), and loosening an agent's limits waits ${esc(me.protection.cosignDelayHours)} hours.</p>` : ""}
      <div class="grid" id="newkey"><label>Name<input name="name" value="Claude Code"></label>
        <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" name="test"> Test key (pretend money, for developers)</label>${limitInputs({ perCallMaxCents: 100, dailyCapCents: 500, approvalThresholdCents: 50 })}</div>
      <div class="row" style="margin-top:10px"><button class="primary" id="create">Create key</button></div><div id="created"></div>
    </div>
    ${agentKeys.map((k) => `<div class="card" data-key="${k.id}">
      <div class="spread"><div><h3>${esc(k.name)} ${k.revokedAt ? `<span class="chip bad">revoked</span>` : ""}</h3>
        <div class="small muted">${esc(k.keyPrefix)}… · created ${date(k.createdAt)}</div>
        <div class="small">Spent ${usd(k.spend.spentLast24hCents)} in 24h · ${usd(k.spend.spentLast30dCents)} in 30 days</div>
        ${k.revokedAt ? "" : `<div class="small"><span class="chip">${esc(k.spend.levelLabel ?? k.level)}</span>${k.coolingOffUntil && new Date(k.coolingOffUntil) > new Date() ? ` <span style="color:var(--warn)">cooling off until ${date(k.coolingOffUntil)}</span>` : ""}</div>`}</div>
        ${k.revokedAt ? "" : `<button class="danger" data-revoke="${k.id}">Revoke</button>`}</div>
      ${k.revokedAt ? "" : `<div class="grid" style="margin-top:10px">${limitInputs(k)}</div><div class="row" style="margin-top:8px"><button data-save="${k.id}">Save limits</button></div>`}
    </div>`).join("")}`;
  el.onclick = (e) => {
    if (e.target.matches("[data-add-rule]")) e.target.previousElementSibling.insertAdjacentHTML("beforeend", ruleRow());
    if (e.target.matches("[data-del-rule]")) e.target.closest(".rule").remove();
  };
  $("#create").onclick = act(async () => {
    const scope = $("#newkey");
    const r = await api("POST", "/api/agent-keys", { name: $("[name=name]", scope).value, ...readLimits(scope), test: $("[name=test]", scope).checked || undefined });
    if (r.agentKey?.test) toast("Test key: it spends pretend money from a test wallet, providers aren't paid, and it only covers paid tool calls.");
    const cfg = { mcpServers: { agentpay: { command: "npx", args: ["-y", "tsx", me.mcpScript], env: { AGENTPAY_URL: location.origin, AGENTPAY_AGENT_KEY: r.key } } } };
    $("#created").innerHTML = `<p class="small">Agent key (shown once):</p><pre>${esc(r.key)}</pre>
      <p class="small">Add it to Claude Code:</p><pre>claude mcp add agentpay --scope user -e AGENTPAY_URL=${esc(location.origin)} -e AGENTPAY_AGENT_KEY=${esc(r.key)} -- npx -y tsx ${esc(me.mcpScript)}</pre>
      <p class="small">Or Claude Desktop (claude_desktop_config.json):</p><pre>${esc(JSON.stringify(cfg, null, 2))}</pre>`;
  });
  el.querySelectorAll("[data-save]").forEach((b) => (b.onclick = act(async () => {
    const r = await api("PATCH", `/api/agent-keys/${b.dataset.save}`, readLimits(b.closest(".card")));
    toast(r?.scheduled ? r.message ?? `Scheduled for ${date(r.effectiveAt)}.` : "Limits saved.");
  })));
  el.querySelectorAll("[data-revoke]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/agent-keys/${b.dataset.revoke}`); toast("Key revoked."); agents(); })));
}

// ------------------------------------------------------------------ passkeys
async function security() {
  const el = $("#tab-security");
  const { passkeys } = await api("GET", "/api/passkeys");
  const supported = !!window.PublicKeyCredential;
  el.innerHTML = `
    <div class="card"><h3>Passkeys</h3>
      <p class="small muted">Approvals for subscriptions, renewals and large calls are signed with a passkey on your phone, laptop or security key.
      Your agents can request spending but can never approve it: a passkey needs you, in person, on your device.</p>
      ${supported ? "" : `<p style="color:var(--bad)">This browser doesn't support passkeys.</p>`}
      <div class="row"><input id="dev" placeholder="Device name, e.g. Work laptop"><button class="primary" id="add" ${supported ? "" : "disabled"}>Add a passkey</button></div>
    </div>
    <div class="card"><table><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr>
      ${passkeys.map((p) => `<tr><td>${esc(p.deviceName)}</td><td class="small">${date(p.createdAt)}</td><td class="small">${date(p.lastUsedAt) || "never"}</td>
        <td><button class="danger" data-del="${esc(p.id)}">Remove</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">No passkeys yet.</td></tr>`}
    </table></div>`;
  $("#add").onclick = act(async () => {
    const options = await api("POST", "/api/passkeys/register/start");
    const response = await startRegistration({ optionsJSON: options });
    await api("POST", "/api/passkeys/register/finish", { response, deviceName: $("#dev").value || navigator.platform || "Passkey" });
    toast("Passkey added."); await refreshCounts(); security();
  });
  el.querySelectorAll("[data-del]").forEach((b) => (b.onclick = act(async () => { await api("DELETE", `/api/passkeys/${encodeURIComponent(b.dataset.del)}`); await refreshCounts(); security(); })));
}

// ------------------------------------------------------------------ provider
async function provider() {
  const el = $("#tab-provider");
  const { providers } = await api("GET", "/api/providers");
  if (!providers.length) {
    el.innerHTML = `<div class="card"><h3>Sell tools and plans to agents</h3><p class="small muted">List an API as a paid tool; agents pay per call, and you can sell subscription plans that include calls.</p>
      <div class="row"><input id="pname" placeholder="Business name"><button class="primary" id="mk">Become a provider</button></div></div>`;
    $("#mk").onclick = act(async () => { await api("POST", "/api/providers", { name: $("#pname").value }); provider(); });
    return;
  }
  const d = await api("GET", `/api/providers/${providers[0].id}`);
  const pid = d.provider.id;
  const connect = await api("GET", `/api/providers/${pid}/connect`).catch(() => ({}));
  el.innerHTML = `
    <div class="card spread"><div><div class="muted small">${esc(d.provider.name)} · earnings available</div><div class="big">${usd(d.earningsCents)}</div></div>
      <div class="row"><button id="payout" ${d.earningsCents > 0 ? "" : "disabled"}>Pay out ${usd(d.earningsCents)}</button></div></div>
    <div class="card"><h3>Getting paid</h3>
      ${connect.payoutsEnabled
        ? `<p class="small"><span class="chip ok">Stripe connected</span> Payouts go to your Stripe account, and Stripe pays them to your bank on your payout schedule.</p>`
        : `<p class="small">Connect a Stripe account to receive your earnings. Stripe collects and checks your details and bank account; AgentPay never sees them.</p>
           <div class="row"><button class="primary" id="connect">${connect.stripeAccountId ? "Finish Stripe setup" : "Connect Stripe"}</button></div>`}
      <div class="row" style="margin-top:8px"><label class="small" style="flex-direction:row;align-items:center;gap:6px">Pay out automatically from $<input id="autopay" type="number" step="1" min="1" style="width:90px" value="${connect.autoPayoutMinCents ? connect.autoPayoutMinCents / 100 : ""}" placeholder="off"></label><button id="saveauto">Save</button></div>
    </div>
    <div class="card"><h3>Tools</h3><div class="table-wrap"><table><tr><th>Tool</th><th>Pricing</th><th>Endpoint</th><th></th></tr>
      ${d.tools.map((t) => `<tr><td><b>${esc(t.slug)}</b><div class="small muted">${esc(t.description)}</div></td>
        <td class="small">${t.pricing.type === "per_call" ? usd(t.pricing.priceCents) + " / call" : usd(t.pricing.priceCentsPerUnit) + " / " + esc(t.pricing.unitsField)}</td>
        <td class="small muted">${esc(t.upstreamUrl)}</td><td><button data-tool="${esc(t.slug)}" data-active="${t.active}">${t.active ? "Pause" : "Resume"}</button></td></tr>`).join("")}
    </table></div>
      <div class="grid" id="newtool" style="margin-top:10px">
        <label>Slug<input name="slug" placeholder="my-api"></label><label>Name<input name="name"></label>
        <label>Pricing<select name="pricing"><option value="per_call">Fixed price per call</option><option value="quoted">Quoted per task (price below is the maximum)</option></select></label>
        <label>Price per call, or maximum ($)<input name="price" type="number" step="0.01" min="0" value="0.05"></label>
        <label>Answers<select name="mode"><option value="sync">Right away (within 30 s)</option><option value="async">Later, as a job (callback)</option></select></label>
        <label>Endpoint URL<input name="url" placeholder="https://api.example.com/agentpay"></label>
        <label>Authorization header<input name="auth" placeholder="Bearer secret"></label>
        <label>Description<input name="desc"></label>
      </div><div class="row" style="margin-top:8px"><button id="addtool">Add tool</button></div>
      <p class="small muted">Every request AgentPay sends you is signed: check it with <code>@winsley-jeune/agentpay-verify</code>. Agents selling their work can quote a price per task and run as jobs. See docs/providers.md.</p>
    </div>
    <div class="card"><h3>Plans</h3><div class="table-wrap"><table><tr><th>Plan</th><th>Category</th><th class="num">Price</th><th>Includes</th><th></th></tr>
      ${d.plans.map((p) => `<tr><td><b>${esc(p.name)}</b> <span class="small muted">${esc(p.slug)}</span></td><td>${esc(p.category)}</td>
        <td class="num">${usd(p.priceCents)}/${p.interval}</td><td class="small">${p.includedCalls ? p.includedCalls + " × " + esc(p.toolSlug) : "—"}</td>
        <td><button data-plan="${esc(p.slug)}" data-active="${p.active}">${p.active ? "Retire" : "Restore"}</button></td></tr>`).join("")}
    </table></div>
      <div class="grid" id="newplan" style="margin-top:10px">
        <label>Slug<input name="slug"></label><label>Name<input name="name"></label><label>Category<input name="category" placeholder="weather"></label>
        <label>Price ($)<input name="price" type="number" step="0.01" min="0.01"></label>
        <label>Every<select name="interval"><option>month</option><option>week</option><option>year</option></select></label>
        <label>Includes calls to tool<select name="tool"><option value="">none</option>${d.tools.filter((t) => t.pricing.type === "per_call").map((t) => `<option>${esc(t.slug)}</option>`).join("")}</select></label>
        <label>Included calls<input name="calls" type="number" min="1"></label><label>Features (comma-separated)<input name="features"></label>
      </div><div class="row" style="margin-top:8px"><button id="addplan">Add plan</button></div>
    </div>
    <div class="card"><h3>Payouts</h3><table>${d.payouts.map((p) => `<tr><td>${date(p.createdAt)}</td><td class="num">${usd(p.amountCents)}</td><td><span class="chip">${p.status}</span></td></tr>`).join("") || `<tr><td class="muted">No payouts yet.</td></tr>`}</table></div>`;
  $("#payout").onclick = act(async () => {
    const r = await api("POST", `/api/providers/${pid}/payouts`, { amountCents: d.earningsCents });
    toast(r.status === "paid" ? "Sent to your Stripe account." : r.waitingFor ? `Set aside; it's sent once ${r.waitingFor}.` : "Payout requested.");
    provider();
  });
  if ($("#connect")) $("#connect").onclick = act(async () => { const r = await api("POST", `/api/providers/${pid}/connect`, {}); location.href = r.onboardingUrl; });
  $("#saveauto").onclick = act(async () => {
    const v = $("#autopay").value.trim();
    await api("PUT", `/api/providers/${pid}/auto-payout`, { minCents: v ? Math.round(Number(v) * 100) : null });
    toast(v ? `Earnings are paid out whenever they reach $${v}.` : "Automatic payouts off."); provider();
  });
  $("#addtool").onclick = act(async () => {
    const f = (n) => $(`#newtool [name=${n}]`).value.trim();
    await api("POST", `/api/providers/${pid}/tools`, { slug: f("slug"), name: f("name"), description: f("desc") || f("name"), pricingType: f("pricing"), mode: f("mode"), priceCents: toCents(f("price")), upstreamUrl: f("url"), upstreamAuth: f("auth") || undefined });
    toast("Tool listed."); provider();
  });
  $("#addplan").onclick = act(async () => {
    const f = (n) => $(`#newplan [name=${n}]`).value.trim();
    await api("POST", `/api/providers/${pid}/plans`, { slug: f("slug"), name: f("name"), description: f("features") || f("name"), category: f("category"), priceCents: toCents(f("price")), interval: f("interval"),
      toolSlug: f("tool") || undefined, includedCalls: f("tool") ? Number(f("calls")) : undefined, features: f("features") ? f("features").split(",").map((s) => s.trim()) : [] });
    toast("Plan listed."); provider();
  });
  el.querySelectorAll("[data-tool]").forEach((b) => (b.onclick = act(async () => { await api("PATCH", `/api/providers/${pid}/tools/${b.dataset.tool}`, { active: b.dataset.active !== "true" }); provider(); })));
  el.querySelectorAll("[data-plan]").forEach((b) => (b.onclick = act(async () => { await api("PATCH", `/api/providers/${pid}/plans/${b.dataset.plan}`, { active: b.dataset.active !== "true" }); provider(); })));
}

boot();
</script>
</body>
</html>
